# cargo-deny — enforces siphon-rtp's hard rules at the dependency-graph level.
# Local: `cargo deny check`  ·  CI: bans+licenses+sources gate every PR on all three lockfiles
# (workspace, fuzz/, crates/siphon-rtp-xdp/; ci.yml); advisories are reported on every PR (ci.yml), run
# daily + on main (audit.yml) and gate the release (release.yaml).
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Evaluate the graph for the Linux media-plane targets we actually ship on.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0436: `paste` is unmaintained. It is a compile-time-only proc-macro (no runtime or
    # network surface, not a vulnerability) reached transitively through `tikv-jemalloc-ctl`, which we
    # use *only* as a dev-dependency for the jemalloc `allocated` memory-leak soak gate (a hard project
    # rule). We don't own that edge and there is no safe upgrade; drop this ignore once
    # tikv-jemalloc-ctl moves off paste.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; compile-time-only, dev-dep via tikv-jemalloc-ctl, no upgrade" },
    # RUSTSEC-2025-0141: `bincode` 1.3.x is unmaintained — the team ceased development after a doxxing
    # incident and considers 1.3.3 a complete, final release (not a vulnerability). Reached transitively
    # through `webrtc-dtls`/`webrtc-util` (the DTLS-SRTP leg in siphon-rtp-dtls). We don't own that edge
    # and there is no safe upgrade path yet; drop this ignore once webrtc-* moves off bincode 1.x.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.x unmaintained (final release, not a vuln); transitive via webrtc-dtls, no upgrade" },
    # RUSTSEC-2026-0173: `proc-macro-error2` is unmaintained (the author confirmed it, and the upstream
    # `proc-macro-error` it forked is likewise abandoned; not a vulnerability). It is a compile-time-only
    # proc-macro reached transitively through `iai-callgrind-macros` / `iai-callgrind`, which we use
    # *only* as a dev-dependency for the instruction-count perf-regression gate. We don't own that edge
    # and there is no safe upgrade; drop this ignore once iai-callgrind moves off proc-macro-error2.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained; compile-time-only, dev-dep via iai-callgrind, no upgrade" },
]

[bans]
# HARD RULE: pure Rust, ZERO C library deps. Codecs are hand-written; crypto/TLS is ring/rustls.
# Ban the well-known C-FFI codec / DSP / TLS / SRTP crates so none can sneak in transitively.
multiple-versions = "warn"
wildcards = "warn"
deny = [
    { name = "openssl", reason = "C OpenSSL — TLS is rustls/ring (zero-C rule)." },
    { name = "openssl-sys", reason = "C OpenSSL FFI — TLS is rustls/ring (zero-C rule)." },
    { name = "native-tls", reason = "wraps the platform C TLS — use rustls (zero-C rule)." },
    { name = "opus", reason = "libopus FFI — Opus is hand-written pure Rust (zero-C rule)." },
    { name = "audiopus", reason = "libopus FFI — Opus is hand-written pure Rust (zero-C rule)." },
    { name = "audiopus_sys", reason = "libopus FFI — Opus is hand-written pure Rust (zero-C rule)." },
    { name = "magnum-opus", reason = "libopus FFI — Opus is hand-written pure Rust (zero-C rule)." },
    { name = "ffmpeg-sys", reason = "FFmpeg FFI — no ffmpeg (zero-C rule)." },
    { name = "ffmpeg-sys-next", reason = "FFmpeg FFI — no ffmpeg (zero-C rule)." },
    { name = "ffmpeg-next", reason = "FFmpeg FFI — no ffmpeg (zero-C rule)." },
    { name = "spandsp-sys", reason = "spandsp FFI — DSP is pure Rust (zero-C rule)." },
    { name = "srtp2-sys", reason = "libsrtp FFI — SRTP is pure Rust / webrtc-rs (zero-C rule)." },
    { name = "libsrtp2-sys", reason = "libsrtp FFI — SRTP is pure Rust / webrtc-rs (zero-C rule)." },
    { name = "speexdsp-sys", reason = "speexdsp FFI — resampler is pure Rust (zero-C rule)." },
    { name = "samplerate", reason = "libsamplerate FFI — resampler is pure Rust (zero-C rule)." },
]

[licenses]
# The crate is MIT; keep dependencies OSI-permissive. Gated per-PR by the ci.yml deny job
# (`check bans licenses sources`) — the verdict is a pure function of the dependency graph, so a PR
# that pulls in a copyleft or unknown-licence crate fails there rather than at release time.
# Deliberately NOT allowed: MPL-2.0 and every other copyleft licence. MPL's file-level copyleft is
# mild enough to be waved through by reflex, which is exactly why it stays off the list — an MPL
# dependency must be an explicit decision on a red PR, not a silent pass. Do not re-add it to make a
# build go green.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CDLA-Permissive-2.0", # webpki-roots — permissive data licence for the bundled Mozilla CA set.
]
confidence-threshold = 0.9
# The three allowances above that no current crate uses (LLVM-exception, Unicode-DFS-2016, Zlib)
# are kept on purpose as pre-approved permissive licences; an unused *permissive* allowance carries
# no signal, so do not let it spam the CI log.
unused-allowed-license = "allow"
# `libfuzzer-sys` bundles libFuzzer, which is LLVM source under LLVM's pre-2019 licence (NCSA, a
# permissive OSI-approved licence). It is reachable only from the fuzz harness in `fuzz/`, which no
# shipped binary includes, so NCSA is allowed for that one crate rather than added to `allow` above.
exceptions = [
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The one git source, and it is temporary. `rtc-dtls` cannot retransmit its last handshake flight:
# `send()` arms no retransmit timer for it, `Endpoint::handle_timeout` gates its only
# `handshake_timeout` call behind `!is_handshake_completed()`, and `Endpoint::read` re-enters the state
# machine only while the handshake is incomplete — so a completed DTLS server answers a repeated peer
# flight with nothing, and the call sits up with no media while every counter reads healthy. RFC 6347
# §4.2.4 makes the last-flight sender responsible for re-sending, and replaying the cached records
# verbatim does not work either: the peer's replay window (§4.1.2.6) drops them, so the retransmission
# has to come from the state machine with fresh record sequence numbers. Proven by
# `session::tests::a_completed_server_retransmits_its_last_flight_when_the_client_repeats_its_own`,
# which fails against the unpatched crate and passes against this fork. Filed upstream as
# webrtc-rs/rtc#243; when that merges, this entry and the `[patch.crates-io]` block in the root
# manifest both come out again.
allow-git = ["https://github.com/killdashnine/rtc"]

# /etc/siphon-rtp/siphon-rtp.conf — environment for the siphon-rtp systemd service.
#
# siphon-rtp is driven entirely by command-line flags (there is no mandatory
# config file). The systemd unit runs:
#
#     ExecStart=/usr/bin/siphon-rtp $SIPHON_RTP_ARGS
#
# so everything the daemon needs is set here, in SIPHON_RTP_ARGS, as one line of
# flags. Edit it, then `systemctl restart siphon-rtp`. This file is a dpkg/rpm
# conf-file: your edits survive package upgrades.
#
# ── The one flag you almost certainly must change for production ──────────────
# A media relay is only useful at an address real peers can reach. The default
# below binds the control socket to loopback and lets media sockets bind
# loopback too — that is a DEV-ONLY posture. In production you MUST tell the
# engine which address to bind and advertise, because a relay's reachable
# address is deployment-specific and the daemon cannot guess it:
#
#   --relay-bind-ip <public-ip>   Bind relay/media sockets to a real, reachable
#                                 IP instead of loopback. This is the production
#                                 posture. Use 0.0.0.0 to bind every interface.
#
#   --advertise-ip <public-ip>    Advertise this IP in rewritten SDP (c=/m=/o=)
#                                 when the socket binds a private/NAT'd address —
#                                 the 1:1-NAT case (e.g. an AWS Elastic IP). The
#                                 socket still binds --relay-bind-ip; only the
#                                 advertised address changes.
#
# ── Other commonly-set flags (all optional) ───────────────────────────────────
#   --control <ip:port>        JSON-over-TCP control listener (default
#                              127.0.0.1:8080). Keep it on a trusted network.
#   --ng <ip:port>             rtpengine NG/bencode control listener (UDP) so
#                              Kamailio / OpenSIPS / SIPhon can drive the engine
#                              over the rtpengine protocol (rtpengine default
#                              :22222). Off unless set.
#   --metrics-addr <ip:port>   Prometheus metrics + health HTTP endpoint
#                              (/metrics, /healthz, /readyz). e.g. 127.0.0.1:9090.
#                              Off unless set.
#   --turn-udp <ip:port>       Built-in TURN server, UDP (turn:). Point it at
#   --turn-tcp <ip:port>       :3478 for the standard port (the unit keeps
#                              CAP_NET_BIND_SERVICE for that). TURN also needs
#                              SIPHON_RTP_TURN_REALM + SIPHON_RTP_TURN_SECRET in
#                              the environment (set them below).
#   --port-min / --port-max    Bounded, firewallable media port range.
#
# Run `/usr/bin/siphon-rtp --help` for the full flag list.

# Dev-only default: loopback control, no reachable media bind. REPLACE the media
# flags for production, e.g.:
#   SIPHON_RTP_ARGS="--control 127.0.0.1:8080 --relay-bind-ip 203.0.113.10 --metrics-addr 127.0.0.1:9090"
SIPHON_RTP_ARGS="--control 127.0.0.1:8080"

# TURN long-term-credential secret + realm, read from the environment (only
# needed if you enable a --turn-* listener above). Uncomment and set:
# SIPHON_RTP_TURN_REALM="example.net"
# SIPHON_RTP_TURN_SECRET="change-me"

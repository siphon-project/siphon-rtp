# siphon-rtp — pure-Rust, kernel-accelerated media engine for SIPhon.
# Workspace virtual manifest. Crates are added as they land (see plan milestones).
[workspace]
resolver = "2"
members = [
    "crates/siphon-rtp-proto",
    "crates/siphon-rtp-simd",
    "crates/siphon-rtp-codec",
    "crates/siphon-rtp-stun",
    "crates/siphon-rtp-ice",
    "crates/siphon-rtp-datapath",
    "crates/siphon-rtp-dsp",
    "crates/siphon-rtp-ebpf-common",
    "crates/siphon-rtp-media",
    "crates/siphon-rtp-srtp",
    "crates/siphon-rtp-dtls",
    "crates/siphon-rtp-turn",
    "crates/siphon-rtp-hep",
    "crates/siphon-rtp-li",
    "crates/siphon-rtp-ngcompat",
    "crates/siphon-rtp-engine",
    # Development-only capacity harness (unpublished, never in the runtime image).
    "crates/siphon-rtp-loadgen",
]
# The XDP loader is its own workspace (with the eBPF program crate at crates/siphon-rtp-xdp/ebpf,
# built on a pinned nightly via aya-build). Excluded so the stable workspace / `cargo test` never
# touch nightly/eBPF.
exclude = ["crates/siphon-rtp-xdp"]

[workspace.package]
version = "0.7.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/siphon-project/siphon-rtp"
homepage = "https://github.com/siphon-project/siphon-rtp"

# Lint levels every member opts into with `[lints] workspace = true`. Only lints that are off by
# default belong here: restating a default group such as `clippy::all = "warn"` would downgrade its
# deny-by-default correctness lints to warnings.
[workspace.lints.clippy]
too_many_lines = "warn"
# Production code never panics on a `None` or an `Err`. Tests are exempt through clippy.toml; bench,
# example and integration-test harness files carry their own inner allow.
unwrap_used = "warn"
expect_used = "warn"

# Shared dependency pins — kept in lockstep with siphon-sip's house versions.
[workspace.dependencies]
# Async runtime + channels
tokio = { version = "1.50", features = ["full"] }
flume = "0.12"
# Buffers / ordered maps / concurrency
bytes = "1.11"
indexmap = { version = "2.13", features = ["serde"] }
dashmap = "6"
arc-swap = "1"
# Transport
socket2 = "0.6"
# TLS — turns: (TURN over TLS) and, later, DTLS-SRTP. Pure-Rust: rustls on the **ring** backend only
# (never aws-lc-rs, which bundles C/asm) — the project's zero-C rule allows ring/rustls explicitly.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
# PEM parsing — the maintained successor to the now-unmaintained rustls-pemfile (RUSTSEC-2025-0134).
# Its PemObject API has lived in rustls-pki-types since 1.9; depend on it directly per that advisory.
rustls-pki-types = { version = "1.9", features = ["alloc"] }
rcgen = "0.14"
# Randomness — ICE credential generation (OS CSPRNG; no bundled C crypto)
getrandom = "0.3"
# WebSocket bridges (pure-Rust: rustls/ring only, no native-tls/OpenSSL). The `wss://` client
# trust store is the Mozilla CA bundle; version-matched to what tokio-tungstenite's
# `rustls-tls-webpki-roots` feature pulls, so only one copy is compiled.
tokio-tungstenite = "0.30"
webpki-roots = "1.0"
futures-util = "0.3"
# HTTP/1.1 client for the `play_media` URL source (fetch a WAV prompt over http/https). Pure Rust,
# no C: hyper's low-level `client::conn` API is driven directly rather than through a pooled client,
# so the connect / first-byte / overall-deadline bounds and the redirect cap are ours to enforce,
# and TLS is the tokio-rustls/ring stack already vendored for `wss://` (never aws-lc-rs, never
# native-tls). `hyper-util` supplies only the tokio<->hyper IO adapter; `http-body-util` the body
# reader the size cap is enforced on.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
# Control protocol (JSON over TCP) + serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
# Errors / logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# CLI / config
clap = { version = "4", features = ["derive"] }
# TOML config-file parsing for the daemon's optional --config file (pure Rust: toml → toml_edit →
# winnow, zero-C rule). `parse` only — no serialization needed.
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
# Allocator (arena contention under the async runtime — see plan §perf)
tikv-jemallocator = "0.6"
# Dev / test
proptest = "1"
criterion = "0.5"
# Deterministic instruction-count benches (valgrind/callgrind) for the CI perf-regression gate.
iai-callgrind = "0.16.1"
tempfile = "3"
tikv-jemalloc-ctl = { version = "0.6", features = [
    "stats",
] } # read jemalloc `stats.allocated` in the memory-leak gates

# Release profile: keep symbols for perf work (mirrors siphon-sip's perf-investigation needs).
[profile.release]
debug = true
strip = false

# rtc-dtls cannot retransmit its last handshake flight: `send()` arms no retransmit timer for it,
# `Endpoint::handle_timeout` gates its only `handshake_timeout` call behind
# `!is_handshake_completed()`, and `Endpoint::read` re-enters the state machine only while the
# handshake is incomplete — so the `// Retransmit last flight` branch is unreachable and a completed
# DTLS server answers a repeated peer flight with nothing. RFC 6347 §4.2.4 requires the last-flight
# sender to re-send, and a verbatim replay of the cached records would be dropped by the peer's replay
# window (§4.1.2.6), so the retransmission has to come from the state machine. Filed upstream as
# webrtc-rs/rtc#243; this pin carries it until that merges, after which the pin (and the `allow-git`
# entry it needs in deny.toml) comes out again.
#
# The siblings are patched from the same source on purpose. A patched `rtc-dtls` depends on
# `rtc-shared`/`rtc-crypto` by path *inside* that repository, so patching only `rtc-dtls` leaves two
# copies of each sibling in the graph — one from crates.io, one from git — at the same version but
# from different sources, which makes them distinct crates whose types do not unify (`expected
# TransportProtocol, found TransportProtocol`). Patching all three keeps exactly one copy of each.
[patch.crates-io]
rtc-dtls = { git = "https://github.com/killdashnine/rtc", branch = "fix/dtls-last-flight-retransmit" }
rtc-shared = { git = "https://github.com/killdashnine/rtc", branch = "fix/dtls-last-flight-retransmit" }
rtc-crypto = { git = "https://github.com/killdashnine/rtc", branch = "fix/dtls-last-flight-retransmit" }

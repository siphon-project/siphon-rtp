# siphon-rtp in containers, including XDP. Two profiles (the plan's dev/prod split):
#
#   dev  — veth pair + SKB-mode (generic) XDP. Runs on any kernel >= 5.10, no NIC driver ZC needed.
#           docker compose --profile dev up --build
#
#   prod — host network + native/zero-copy XDP on the host NIC.
#           docker compose --profile prod up --build
#
# XDP is opt-in until the eBPF crate lands: both profiles build the UDP-loopback binary today
# (proving the caps/bpffs/veth wiring). Set CARGO_FEATURES=xdp under build.args to compile the aya
# XDP datapath. With no caps at all the same image falls back to the UDP backend with a warning.
#
# The built-in TURN server (a coturn replacement) is enabled by SIPHON_RTP_TURN_REALM +
# SIPHON_RTP_TURN_SECRET (coturn `static-auth-secret` REST profile) and serves turn:3478 (UDP+TCP)
# below; turns:5349 (TLS) needs a mounted cert/key (see the commented block). NOTE: with the
# UDP-loopback backend the relay leg binds loopback, so allocations + signalling work but media only
# relays to loopback peers — real external relay needs the XDP/public datapath (CARGO_FEATURES=xdp).

services:
  siphon-rtp-dev:
    profiles: ["dev"]
    build:
      context: .
      target: runtime-dev
      args:
        CARGO_FEATURES: "" # set to "xdp" once crates/siphon-rtp-ebpf exists
    cap_add:
      - NET_ADMIN # attach XDP, manage the veth
      - BPF # load programs / maps (kernels >= 5.8)
      - SYS_ADMIN # mount bpffs on kernels < 5.8
    security_opt:
      - seccomp=unconfined # allow the bpf() syscalls
    ulimits:
      memlock: -1 # locked memory for BPF maps / UMEM
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf:rw # bpffs for pinned maps
      # turns: TLS — mount a cert/key and add --turn-tls below.
      # - ./deploy/turn-tls:/etc/siphon-rtp/turn-tls:ro
    environment:
      # Dev credentials — CHANGE for anything reachable. coturn REST profile (static-auth-secret).
      SIPHON_RTP_TURN_REALM: "${SIPHON_RTP_TURN_REALM:-siphon.local}"
      SIPHON_RTP_TURN_SECRET: "${SIPHON_RTP_TURN_SECRET:-dev-insecure-secret-change-me}"
    ports:
      - "8080:8080" # JSON-over-TCP control
      - "3478:3478/udp" # TURN over UDP (turn:)
      - "3478:3478/tcp" # TURN over TCP (turn:)
      # - "5349:5349/tcp" # TURN over TLS (turns:) — enable with --turn-tls + a mounted cert
    command:
      [
        "--control",
        "0.0.0.0:8080",
        "--turn-udp",
        "0.0.0.0:3478",
        "--turn-tcp",
        "0.0.0.0:3478",
        # "--turn-tls", "0.0.0.0:5349",
        # "--turn-tls-cert", "/etc/siphon-rtp/turn-tls/cert.pem",
        # "--turn-tls-key", "/etc/siphon-rtp/turn-tls/key.pem",
      ]

  siphon-rtp-prod:
    profiles: ["prod"]
    build:
      context: .
      target: runtime
      args:
        CARGO_FEATURES: "" # set to "xdp" for the kernel-accelerated datapath
    network_mode: host # AF_XDP on the host NIC
    cap_add:
      - NET_ADMIN
      - BPF
    ulimits:
      memlock: -1
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf:rw
      # - ./deploy/turn-tls:/etc/siphon-rtp/turn-tls:ro # turns: cert/key
    environment:
      # Required in prod — fail fast if unset (no insecure default for a reachable relay).
      SIPHON_RTP_TURN_REALM: "${SIPHON_RTP_TURN_REALM:?set the TURN realm}"
      SIPHON_RTP_TURN_SECRET: "${SIPHON_RTP_TURN_SECRET:?set the TURN static-auth-secret}"
    # Host network: TURN binds the host's 3478 (and 5349 for turns:). --turn-relay-ip advertises the
    # host's reachable IP in XOR-RELAYED-ADDRESS when the relay socket's bound IP differs.
    command:
      [
        "--control",
        "0.0.0.0:8080",
        "--turn-udp",
        "0.0.0.0:3478",
        "--turn-tcp",
        "0.0.0.0:3478",
        "--turn-relay-ip",
        "${SIPHON_RTP_RELAY_IP:-0.0.0.0}",
        # "--turn-tls", "0.0.0.0:5349",
        # "--turn-tls-cert", "/etc/siphon-rtp/turn-tls/cert.pem",
        # "--turn-tls-key", "/etc/siphon-rtp/turn-tls/key.pem",
      ]

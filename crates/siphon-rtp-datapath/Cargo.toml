# siphon-rtp-datapath — the datapath seam: a backend-agnostic `Datapath` trait plus the
# always-available UDP-loopback backend (NIC-free, used by CI and as the XDP reference).
[package]
name = "siphon-rtp-datapath"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "siphon-rtp datapath seam: backend-agnostic Datapath trait + NIC-free UDP-loopback backend"
readme = "README.md"
keywords = ["rtp", "udp", "relay", "networking", "voip"]
categories = ["network-programming"]

[dependencies]
# The pure `no_std` XDP-ABI + relay-math crate. Depended on unconditionally (not only under the xdp
# backend) so the UDP-loopback datapath reuses its RFC 7983 RTP demux (`rewrite::rtp_media_ssrc`) and
# the RFC 3550 §A.1 forward-gap loss estimate (`loss::rtp_loss_update`) on the plain-relay hot path.
siphon-rtp-ebpf-common = { path = "../siphon-rtp-ebpf-common", version = "0.4.0" }
siphon-rtp-stun = { path = "../siphon-rtp-stun", version = "0.4.0" }
tokio = { workspace = true }
flume = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# `IP_TOS` / `IPV6_TCLASS` on a bound media socket (the DSCP marking, RFC 2474). tokio's `UdpSocket`
# exposes no setsockopt surface for these, and socket2 borrows the fd rather than taking it, so the
# option is set on the already-bound tokio socket without a conversion round trip.
socket2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
criterion = { workspace = true }

# Per-packet dispatch cost: the Redirect / Forward paths plus the layer-4 ICE gate's own lookups.
[[bench]]
name = "dispatch_bench"
harness = false

# siphon-rtp-datapath — the datapath seam: a backend-agnostic `Datapath` trait plus the
# always-available UDP-loopback backend (NIC-free, used by CI and as the XDP reference).
[package]
name = "siphon-rtp-datapath"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "siphon-rtp datapath seam: backend-agnostic Datapath trait + NIC-free UDP-loopback backend"
readme = "README.md"
keywords = ["rtp", "udp", "relay", "networking", "voip"]
categories = ["network-programming"]

[dependencies]
siphon-rtp-stun = { path = "../siphon-rtp-stun", version = "0.1.0" }
tokio = { workspace = true }
flume = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

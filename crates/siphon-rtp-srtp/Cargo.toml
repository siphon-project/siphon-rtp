# siphon-rtp-srtp — pure-Rust SRTP/SRTCP (RFC 3711) for the SDES bridge legs. AES-CM + HMAC-SHA1
# via the RustCrypto primitives (pure Rust, zero C — no libsrtp/OpenSSL). Isolated from the engine
# so the crypto core validates against the RFC vectors on its own.
[package]
name = "siphon-rtp-srtp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "siphon-rtp pure-Rust SRTP/SRTCP (RFC 3711): AES-CM + HMAC-SHA1 via RustCrypto, zero C deps"
readme = "README.md"
keywords = ["srtp", "rtp", "crypto", "webrtc", "voip"]
categories = ["network-programming", "cryptography"]

[dependencies]
# Pinned below the RustCrypto 0.9 wave: aes 0.9 / ctr 0.10 (cipher 0.5) regress the SRTP AES-CTR hot
# path 20–60% vs 0.8/0.9 (cipher 0.4) — the batched AES-NI block path is lost. These are not security
# bumps (no RUSTSEC advisory on the 0.8/0.9/0.12/0.10 line); revisit the upgrade once upstream restores
# the bulk path. See the perf-investigation notes.
# `zeroize` wipes the AES round keys when the cipher drops.
aes = { version = "0.8", features = ["zeroize"] }
ctr = "0.9"
hmac = "0.12"
sha1 = "0.10"
subtle = "2.6"
# AEAD_AES_128_GCM for SRTCP floor control (RFC 7714). 0.10.x stays on aes 0.8 / cipher 0.4 / ctr 0.9
# like the rest of this crate (0.11 would pull the cipher 0.5 wave, see above). >= 0.10.3 is required:
# RUSTSEC-2023-0096 (decrypt-in-place-detached exposed unauthenticated plaintext) is fixed there.
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "zeroize"] }
base64 = "0.23"
getrandom = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
iai-callgrind = { workspace = true }

[[bench]]
name = "srtp_bench"
harness = false

# Deterministic instruction-count gate (valgrind/callgrind) for the CI perf-regression gate.
[[bench]]
name = "srtp_iai"
harness = false

[lints]
workspace = true

# siphon-rtp-dtls — pure-Rust DTLS-SRTP (RFC 5764) keying for secure WebRTC legs. The handshake runs
# on the sans-I/O rtc-dtls crate (ring crypto, zero C libraries), and the exported keying
# material feeds the existing siphon-rtp-srtp SecureLeg, so DTLS-keyed and SDES-keyed legs share one
# media path.
[package]
name = "siphon-rtp-dtls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "siphon-rtp pure-Rust DTLS-SRTP (RFC 5764) keying: rtc-dtls handshake → SRTP SecureLeg, zero C deps"
readme = "README.md"
keywords = ["dtls", "srtp", "webrtc", "rtp", "voip"]
categories = ["network-programming", "cryptography"]

[dependencies]
# Sans-I/O DTLS handshake + RFC 5764 key export: it owns no socket, reads no clock and spawns no
# task, so the engine drives it and the handshake's lifetime is ours to control. Pinned exactly —
# the 0.20/0.21 line moves fast. 0.21.1 carries the RFC 6347 §4.2.4 last-flight retransmission fix
# (webrtc-rs/rtc#243).
rtc-dtls = { version = "=0.21.1", default-features = false, features = ["crypto-ring"] }
# `TransportProtocol` for the endpoint constructor. Its three features are empty markers, so none.
rtc-shared = { version = "=0.21.1", default-features = false }
# SCTP association (RFC 9260) and DCEP data channels (RFC 8832) over the DTLS association (RFC 8261,
# RFC 8831), for the MCPTT floor channel of a browser seat. Sans-I/O like rtc-dtls, pinned exactly.
rtc-sctp = { version = "=0.21.1" }
rtc-datachannel = { version = "=0.21.1" }
# The SRTP secure leg the exported keying material is fed into (shared with the SDES path).
siphon-rtp-srtp = { path = "../siphon-rtp-srtp" }
# Certificate fingerprints (RFC 8122): SHA-256 default, SHA-384/512 + SHA-1 for interop.
sha2 = "0.11"
sha1 = "0.10"
bytes = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

[package]
name = "siphon-rtp-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "siphon-rtp pure-Rust audio codecs: G.711/L16/G.722/G.726/GSM-FR/CN, plus AMR-NB/WB behind the `amr` feature, zero C deps"
readme = "README.md"
keywords = ["codec", "audio", "g711", "amr", "voip"]
categories = ["multimedia::audio"]

[features]
default = []
# ── Patent-encumbered codecs: OFF by default ──────────────────────────────────────────────────
# These features gate codec TRANSCODING (decode/encode) only. Passthrough/relay of ANY codec is
# always available and carries no patent exposure — the codec is never executed, packets are
# forwarded byte-for-byte (rtpengine's default posture). Enabling a feature below is an explicit
# statement that YOU, the operator, hold the necessary patent licence for that codec in your
# jurisdiction. See docs/codec-licensing.md. (g729 / evs added when those codecs land.)
amr = [] # AMR-NB / AMR-WB (3GPP TS 26.071 / 26.171) — the VoLTE codecs.

[dependencies]
thiserror = { workspace = true }
siphon-rtp-simd = { path = "../siphon-rtp-simd", version = "0.3.0" }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tikv-jemallocator = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }
iai-callgrind = { workspace = true }

[[bench]]
name = "codec_bench"
harness = false

# The SILK NLSF stage (RFC 6716 §4.2.7.5): a per-20 ms-frame datapath cost of its own, kept in its
# own bench file so it can be run without building the whole codec bench.
[[bench]]
name = "silk_nlsf_bench"
harness = false

# Deterministic instruction-count gate (valgrind/callgrind). Unlike the criterion wall-clock benches,
# these are stable enough on a shared CI runner to fail on a >N% regression. See ci.yml `perf-gate`.
[[bench]]
name = "codec_iai"
harness = false

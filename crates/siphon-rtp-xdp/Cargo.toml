# siphon-rtp-xdp — the XDP/AF_XDP datapath backend (userspace loader). Kept a SEPARATE crate from
# siphon-rtp-datapath so the kernel-acceleration plumbing never disturbs the always-available
# UDP-loopback backend; it implements the same `Datapath` trait. Userspace code builds on stable,
# but its build.rs compiles the eBPF program (needs the pinned-nightly toolchain + bpf-linker), so
# the crate is excluded from the default workspace and built only via the docker xdp toolchain.
[package]
# Concrete values (not `*.workspace = true`): this is a standalone workspace with no
# `[workspace.package]` to inherit from.
name = "siphon-rtp-xdp"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "siphon-rtp XDP/AF_XDP datapath backend (userspace loader) — kernel-accelerated RTP relay"
repository = "https://github.com/siphon-project/siphon-rtp"
homepage = "https://github.com/siphon-project/siphon-rtp"
readme = "README.md"
keywords = ["xdp", "ebpf", "af-xdp", "rtp", "networking"]
categories = ["network-programming"]
# Kept unpublishable: build.rs compiles the eBPF program with a pinned nightly + bpf-linker, which a
# plain `cargo install` would not have. Flip once that build is reproducible from a registry install
# (and the path-deps are published). See README.
publish = false

[dependencies]
# Concrete versions: standalone workspace, no `workspace.dependencies` to inherit. The AF_XDP data
# half (xsk.rs rings + the async Datapath impl) brings in libc (raw AF_XDP uapi: socket/mmap/bind),
# tokio (async Datapath methods + the busy-poll RX thread), bytes (RxPacket buffers), and flume
# (the redirect/observe streams, pinned to the parent workspace's 0.12).
siphon-rtp-datapath = { path = "../siphon-rtp-datapath" }
siphon-rtp-ebpf-common = { path = "../siphon-rtp-ebpf-common" }
# The engine daemon library (package `siphon-rtp`, dir `siphon-rtp-engine`, lib `siphon_rtp_engine`)
# — the `siphon-rtp-xdp-daemon` binary probes/attaches the kernel datapath and drives it through
# `siphon_rtp_engine::run_with_datapath`. This is the INVERTED dependency edge the design mandates:
# engine (UDP-only, stable) is depended UP INTO by the XDP workspace; the engine never depends on this
# crate. No `version = ` (path-only): the engine is unpublished alongside this.
siphon-rtp = { path = "../siphon-rtp-engine" }
aya = "0.13"
libc = "0.2"
tokio = { version = "1.50", features = ["rt", "rt-multi-thread", "net", "sync", "macros"] }
flume = "0.12"
bytes = "1.11"
dashmap = "6"
thiserror = "2"
tracing = "0.1"
# The daemon binary reuses the engine's `EngineArgs` (a flattenable `clap::Args`) and adds the two
# `--xdp-*` knobs; pinned to clap 4 to match the engine's own clap so `#[command(flatten)]` unifies.
clap = { version = "4", features = ["derive"] }
# Next-hop MAC resolution (the `neighbor` module) talks to the kernel routing/neighbour/link tables
# over rtnetlink. Chosen over `neli`: rtnetlink gives typed RTM_GETROUTE/GETNEIGH/GETLINK query
# builders on an async Tokio socket and re-exports its `netlink-packet-route` message types, so the
# same POD types the async worker receives are the ones the pure extractors + wire-fixture tests
# parse — pure Rust, zero C deps. Pinned to rtnetlink 0.21's own netlink-packet-route (0.30) so there
# is a single version of the message types across the crate.
rtnetlink = "0.21"
netlink-packet-route = "0.30"
netlink-packet-core = "0.8"
futures = "0.3"

# No `[build-dependencies]`: build.rs invokes the eBPF build directly (rustup run <toolchain> cargo
# build --target bpfel-unknown-none) instead of via aya-build, whose 0.1.x OUT_DIR embed copies the
# artifact onto its own `--target-dir` path ("Is a directory"). See build.rs for the full rationale.

# Dev-only: criterion for both hot-path microbenches; libc (also a normal dep) for the veth
# XDP_TX smoke's raw AF_PACKET inject/capture.
[dev-dependencies]
criterion = "0.5"
libc = "0.2"

# The TX-path next-hop-MAC cache-hit microbench (µs/frame gate; the Stage-1 neighbour resolver).
[[bench]]
name = "neighbor_bench"
harness = false

# The in-kernel FORWARD relay's per-packet rewrite cost (RFC 1624 checksum fixups + the latch
# decision) — benched as `siphon_rtp_ebpf_common::rewrite`, the exact math the eBPF program runs.
[[bench]]
name = "rewrite_bench"
harness = false

# The Stage 3a per-flow feedback read path: the loader-side per-CPU stats reduction (sum_flow_stats)
# + the last_activity ns->tick conversion (kernel_ns_to_tick) — the host-benchable half of the new
# per-flow bookkeeping cost.
[[bench]]
name = "stats_feedback_bench"
harness = false

# A small workspace pairing the loader with the eBPF program crate (so build.rs's
# `cargo build --package siphon-rtp-ebpf` resolves). Excluded from the parent stable workspace; the
# docker xdp build invokes it explicitly with nightly + bpf-linker on PATH.
[workspace]
members = ["ebpf"]

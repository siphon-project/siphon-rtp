# siphon-rtp — the engine daemon (crate `siphon-rtp`, in dir `crates/siphon-rtp-engine/`):
# JSON-over-TCP control front-end, session manager, and (later) the actor runtime + aya loader.
# M1 walking skeleton: offer/answer/relay/delete on the UDP-loopback datapath, NIC-free.
# This is the crate users install: `cargo install siphon-rtp` yields the `siphon-rtp` binary.
[package]
name = "siphon-rtp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "siphon-rtp — pure-Rust, kernel-accelerated RTP media engine daemon for SIPhon"
readme = "README.md"
keywords = ["rtp", "voip", "media", "sip", "rtpengine"]
categories = ["network-programming", "multimedia::audio"]

[features]
default = []
# Build the patent-encumbered AMR-NB/AMR-WB codecs into the engine (transcode + conference egress).
# Off by default; passthrough/relay of AMR is always available. See docs/codec-licensing.md.
amr = ["siphon-rtp-codec/amr"]

[[bin]]
name = "siphon-rtp"
path = "src/main.rs"

# The lib target keeps its historical name so the crate's own tests (`use siphon_rtp_engine::…`)
# stay untouched; only the published package and the installed binary are renamed to `siphon-rtp`.
[lib]
name = "siphon_rtp_engine"
path = "src/lib.rs"

[dependencies]
siphon-rtp-proto = { path = "../siphon-rtp-proto", version = "0.1.0" }
siphon-rtp-datapath = { path = "../siphon-rtp-datapath", version = "0.1.0" }
siphon-rtp-stun = { path = "../siphon-rtp-stun", version = "0.1.0" }
siphon-rtp-srtp = { path = "../siphon-rtp-srtp", version = "0.1.0" }
siphon-rtp-dtls = { path = "../siphon-rtp-dtls", version = "0.1.0" }
siphon-rtp-turn = { path = "../siphon-rtp-turn", version = "0.1.0" }
siphon-rtp-hep = { path = "../siphon-rtp-hep", version = "0.1.0" }
siphon-rtp-ngcompat = { path = "../siphon-rtp-ngcompat", version = "0.1.0" }
siphon-rtp-codec = { path = "../siphon-rtp-codec", version = "0.1.0" }
siphon-rtp-media = { path = "../siphon-rtp-media", version = "0.1.0" }
siphon-rtp-dsp = { path = "../siphon-rtp-dsp", version = "0.1.0" }
tokio = { workspace = true }
# `rustls-tls-webpki-roots` gives the WebSocket bridge a `wss://` client (RFC 6455 over RFC 8446).
# Pure Rust: it pulls tokio-rustls/rustls with `default-features = false`, so no aws-lc-rs — the
# ring provider (installed explicitly, see engine.rs) is the only backend compiled.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
# Build the explicit ring-backed `wss://` client config (RootCertStore + no client auth).
rustls = { workspace = true }
# The Mozilla CA bundle seeded into that client config's trust store.
webpki-roots = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
flume = { workspace = true }
getrandom = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
# Optional TOML config file (`--config`) deserialized into a serde struct; CLI args take precedence.
serde = { workspace = true }
# Serialize the HA CallSnapshot to an opaque JSON blob for the checkpoint/restore control verbs.
serde_json = { workspace = true }
toml = { workspace = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }
# Read jemalloc `stats.allocated` for the `siphon_rtp_jemalloc_allocated_bytes` metric (the same
# allocator surface the leak gate uses). Pure Rust over the jemalloc already linked as the allocator.
tikv-jemalloc-ctl = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
siphon-rtp-proto = { path = "../siphon-rtp-proto", version = "0.1.0" }
siphon-rtp-datapath = { path = "../siphon-rtp-datapath", version = "0.1.0" }
# Construct a `MediaCall`'s two `DirectionConfig`s directly (codecs, MOS class) and build RTP fixtures
# for the media-pipeline echo-cancellation zero-allocation soak (tests/media_aec_zero_alloc.rs).
siphon-rtp-codec = { path = "../siphon-rtp-codec", version = "0.1.0" }
siphon-rtp-media = { path = "../siphon-rtp-media", version = "0.1.0" }
siphon-rtp-hep = { path = "../siphon-rtp-hep", version = "0.1.0" }
bytes = { workspace = true }
tikv-jemallocator = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
# `wss://` handshake test: a self-signed TLS WebSocket server (rcgen cert → tokio-rustls acceptor)
# the engine dials, proving the ring/rustls connector completes the TLS + WS upgrade end-to-end.
rcgen = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }

# siphon-rtp — the engine daemon (crate `siphon-rtp`, in dir `crates/siphon-rtp-engine/`):
# JSON-over-TCP control front-end, session manager, and (later) the actor runtime + aya loader.
# M1 walking skeleton: offer/answer/relay/delete on the UDP-loopback datapath, NIC-free.
# This is the crate users install: `cargo install siphon-rtp` yields the `siphon-rtp` binary.
[package]
name = "siphon-rtp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "siphon-rtp — pure-Rust, kernel-accelerated RTP media engine daemon for SIPhon"
readme = "README.md"
keywords = ["rtp", "voip", "media", "sip", "rtpengine"]
categories = ["network-programming", "multimedia::audio"]

[features]
default = []
# Build the patent-encumbered AMR-NB/AMR-WB codecs into the engine (transcode + conference egress).
# Off by default; passthrough/relay of AMR is always available. See docs/codec-licensing.md.
amr = ["siphon-rtp-codec/amr"]

[[bin]]
name = "siphon-rtp"
path = "src/main.rs"

# The lib target keeps its historical name so the crate's own tests (`use siphon_rtp_engine::…`)
# stay untouched; only the published package and the installed binary are renamed to `siphon-rtp`.
[lib]
name = "siphon_rtp_engine"
path = "src/lib.rs"

[dependencies]
siphon-rtp-proto = { path = "../siphon-rtp-proto", version = "0.2.0" }
siphon-rtp-datapath = { path = "../siphon-rtp-datapath", version = "0.2.0" }
siphon-rtp-stun = { path = "../siphon-rtp-stun", version = "0.2.0" }
siphon-rtp-ice = { path = "../siphon-rtp-ice", version = "0.2.0" }
siphon-rtp-srtp = { path = "../siphon-rtp-srtp", version = "0.2.0" }
siphon-rtp-dtls = { path = "../siphon-rtp-dtls", version = "0.2.0" }
siphon-rtp-turn = { path = "../siphon-rtp-turn", version = "0.2.0" }
siphon-rtp-hep = { path = "../siphon-rtp-hep", version = "0.2.0" }
siphon-rtp-ngcompat = { path = "../siphon-rtp-ngcompat", version = "0.2.0" }
siphon-rtp-codec = { path = "../siphon-rtp-codec", version = "0.2.0" }
siphon-rtp-media = { path = "../siphon-rtp-media", version = "0.2.0" }
siphon-rtp-dsp = { path = "../siphon-rtp-dsp", version = "0.2.0" }
tokio = { workspace = true }
# `rustls-tls-webpki-roots` gives the WebSocket bridge a `wss://` client (RFC 6455 over RFC 8446).
# Pure Rust: it pulls tokio-rustls/rustls with `default-features = false`, so no aws-lc-rs — the
# ring provider (installed explicitly, see engine.rs) is the only backend compiled.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
# Build the explicit ring-backed `wss://` client config (RootCertStore + no client auth).
rustls = { workspace = true }
# The Mozilla CA bundle seeded into that client config's trust store.
webpki-roots = { workspace = true }
# `play_media` from an http(s) URL: hyper's low-level HTTP/1.1 client over a socket we connect (and
# time out) ourselves, with tokio-rustls terminating TLS on the same ring-backed client config the
# `wss://` bridge uses. See `media_fetch.rs` for the bounds and the security posture.
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
tokio-rustls = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
flume = { workspace = true }
getrandom = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
# Optional TOML config file (`--config`) deserialized into a serde struct; CLI args take precedence.
serde = { workspace = true }
# Serialize the HA CallSnapshot to an opaque JSON blob for the checkpoint/restore control verbs.
serde_json = { workspace = true }
toml = { workspace = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }
# Read jemalloc `stats.allocated` for the `siphon_rtp_jemalloc_allocated_bytes` metric (the same
# allocator surface the leak gate uses). Pure Rust over the jemalloc already linked as the allocator.
tikv-jemalloc-ctl = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
siphon-rtp-proto = { path = "../siphon-rtp-proto", version = "0.2.0" }
siphon-rtp-datapath = { path = "../siphon-rtp-datapath", version = "0.2.0" }
# Construct a `MediaCall`'s two `DirectionConfig`s directly (codecs, MOS class) and build RTP fixtures
# for the media-pipeline echo-cancellation zero-allocation soak (tests/media_aec_zero_alloc.rs).
siphon-rtp-codec = { path = "../siphon-rtp-codec", version = "0.2.0" }
siphon-rtp-media = { path = "../siphon-rtp-media", version = "0.2.0" }
siphon-rtp-hep = { path = "../siphon-rtp-hep", version = "0.2.0" }
bytes = { workspace = true }
tikv-jemallocator = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
# `wss://` handshake test: a self-signed TLS WebSocket server (rcgen cert → tokio-rustls acceptor)
# the engine dials, proving the ring/rustls connector completes the TLS + WS upgrade end-to-end.
rcgen = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }

# The per-packet cost a *secure* media-pipeline leg pays — the SRTP (de)crypt the pipeline adds on
# top of a plaintext transcode, and the cost of the DTLS pending-key gate before a leg is keyed.
[[bench]]
name = "secure_pipeline_bench"
harness = false

# --- Debian packaging (cargo-deb) ---
# This crate is a workspace member (crates/siphon-rtp-engine/), so the release binary lands at the
# WORKSPACE target dir (target/<triple>/release/siphon-rtp). cargo-deb rewrites a `target/release/`
# asset prefix to the real workspace target dir (and to target/<triple>/release when `--target` is
# given). The other assets live at the repo root, two levels up from this manifest, hence `../../`.
# Invoke from the repo root: `cargo deb -p siphon-rtp --no-build` (add `--target <triple>` in CI).
[package.metadata.deb]
name = "siphon-rtp"
maintainer = "SIPhon Contributors <mvdvlies@gmail.com>"
section = "net"
priority = "optional"
extended-description = """\
siphon-rtp is a standalone, pure-Rust, kernel-accelerated media engine for \
SIPhon: an RTP/SRTP relay (userspace UDP, plus an optional eBPF/XDP fast path in \
a separate daemon), pure-Rust transcoding (G.711, G.722, G.726, AMR-NB/WB, Opus, \
…), audio forking and conferencing, and bidirectional RTP↔WebSocket streaming \
for voice-AI. It is a drop-in for SIPhon's native JSON-over-TCP control and for \
existing Kamailio/OpenSIPS rtpengine deployments via the NG/bencode front-end."""
depends = "$auto"
assets = [
    ["target/release/siphon-rtp", "usr/bin/", "755"],
    ["../../dist/siphon-rtp.service", "lib/systemd/system/siphon-rtp.service", "644"],
    ["../../dist/siphon-rtp.conf", "etc/siphon-rtp/siphon-rtp.conf", "644"],
    ["../../etc/logrotate.d/siphon-rtp", "etc/logrotate.d/siphon-rtp", "644"],
    ["../../README.md", "usr/share/doc/siphon-rtp/README.md", "644"],
    ["../../LICENSE", "usr/share/doc/siphon-rtp/LICENSE", "644"],
]
conf-files = ["/etc/siphon-rtp/siphon-rtp.conf", "/etc/logrotate.d/siphon-rtp"]
maintainer-scripts = "../../dist/debian/"
systemd-units = { unit-name = "siphon-rtp", enable = false, start = false }

# --- RPM packaging (cargo-generate-rpm) ---
# Pure Rust, no rpmbuild needed. Invoke from the repo root: `cargo generate-rpm -p siphon-rtp`
# (add `--target <triple>` in CI, which rewrites the `target/release/` binary prefix the same way).
# generate-rpm resolves source paths relative to the workspace root, so these are repo-root-relative.
# cargo-generate-rpm reads the config, assets, AND scriptlet keys directly from this table (the
# scriptlet keys are NOT a `.scriptlets` subtable — that nesting is silently ignored).
# `config = "noreplace"` marks a %config(noreplace) file: on upgrade rpm keeps the operator's edited
# file untouched and drops the new default as .rpmnew — the .conf carries the operator's public relay
# IP, which an upgrade must never reset to the dev loopback default (the dpkg conffiles equivalent).
[package.metadata.generate-rpm]
name = "siphon-rtp"
assets = [
    { source = "target/release/siphon-rtp", dest = "/usr/bin/siphon-rtp", mode = "755" },
    { source = "dist/siphon-rtp.service", dest = "/usr/lib/systemd/system/siphon-rtp.service", mode = "644" },
    { source = "dist/siphon-rtp.conf", dest = "/etc/siphon-rtp/siphon-rtp.conf", mode = "644", config = "noreplace" },
    { source = "etc/logrotate.d/siphon-rtp", dest = "/etc/logrotate.d/siphon-rtp", mode = "644", config = "noreplace" },
    { source = "README.md", dest = "/usr/share/doc/siphon-rtp/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/siphon-rtp/LICENSE", mode = "644", doc = true },
]

# RPM scriptlets: create the system user, own the state/log dirs, reload systemd, stop on removal.
pre_install_script = """
getent group siphon-rtp >/dev/null || groupadd -r siphon-rtp
getent passwd siphon-rtp >/dev/null || useradd -r -g siphon-rtp -d /var/lib/siphon-rtp -s /sbin/nologin -c "siphon-rtp media engine" siphon-rtp
mkdir -p /var/lib/siphon-rtp /var/log/siphon-rtp
chown siphon-rtp:siphon-rtp /var/lib/siphon-rtp /var/log/siphon-rtp
"""
post_install_script = """
systemctl daemon-reload
"""
pre_uninstall_script = """
systemctl stop siphon-rtp.service 2>/dev/null || true
systemctl disable siphon-rtp.service 2>/dev/null || true
"""
post_uninstall_script = """
systemctl daemon-reload
"""

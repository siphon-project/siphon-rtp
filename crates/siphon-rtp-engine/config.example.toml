# siphon-rtp-engine — example TOML config file.
#
# Pass it with `--config /etc/siphon-rtp/config.toml`. It is entirely optional: the daemon runs with
# just CLI flags (or all built-in defaults) and no config file at all.
#
# Precedence (highest wins):
#   1. an explicit CLI flag  (something you actually typed on the command line)
#   2. this config file      (any key set below)
#   3. the built-in default
#
# So this file overrides the built-in defaults, and any CLI flag you pass overrides this file. Every
# key is optional — set only the ones you want to override; unset keys fall through to the default.
# Unknown/mistyped keys are a hard error (so a typo is loud, not silently ignored).
#
# Secrets are deliberately NOT config-file keys and are never on the command line either: the
# control-plane shared secret, TURN realm/secret, and HEP collector are read from the environment
# (SIPHON_RTP_CONTROL_SECRET, SIPHON_RTP_TURN_REALM, SIPHON_RTP_TURN_SECRET, SIPHON_RTP_HEP_COLLECTOR,
# SIPHON_RTP_HEP_AGENT_ID) so they never land in argv or a world-readable file.

# --- Control plane ------------------------------------------------------------------------------

# JSON-over-TCP control listen address (CLI: --control). Default: "127.0.0.1:8080".
control = "127.0.0.1:8080"

# rtpengine NG/bencode control listen address, UDP (CLI: --ng). Off unless set (rtpengine default
# :22222). Lets SIPhon / Kamailio / OpenSIPS drive the engine over the rtpengine protocol unchanged.
# ng = "0.0.0.0:22222"

# Per-connection control request cap, requests/second; 0 disables the limit (CLI: --max-control-rps).
# max_control_rps = 5000

# --- Media / relay ------------------------------------------------------------------------------

# Bind relay/media sockets to this IP instead of loopback (CLI: --relay-bind-ip) — the production
# posture so the relay is reachable by real peers. With a 0.0.0.0 bind or a NAT'd host, pair with
# advertise_ip (below) to advertise the reachable SDP address (and turn_relay_ip for the TURN server).
# relay_bind_ip = "0.0.0.0"

# Deterministic media port range (CLI: --port-min / --port-max). Set BOTH to draw media ports from a
# bounded, firewallable window (rtpengine port-min/port-max parity) instead of OS-ephemeral ports;
# also the prerequisite for HA takeover (a standby re-binds the same port behind a floating IP).
# Size it for your concurrency: up to 4 ports per call (RTP+RTCP per leg), 2 with rtcp-mux. Unset =
# OS-ephemeral ports. A half-set or inverted range is a fatal startup error.
# port_min = 30000
# port_max = 40000

# Reap a call after this many seconds with no accepted media (CLI: --media-timeout-secs).
# Default: 30.
# media_timeout_secs = 30

# --- play_media from an http(s) URL --------------------------------------------------------------
#
# `play_media` can fetch a WAV prompt from a URL. The fetch runs on its own task (never on the media
# path or the control connection) and every bound below is a hard stop — a fetch that outlives one
# ends the playback with `play_finished` reason `error`, and the leg keeps relaying untouched.
#
# DNS + TCP connect + TLS, per redirect hop (CLI: --media-fetch-connect-timeout-ms). Default: 2000.
# media_fetch_connect_timeout_ms = 2000
#
# Wait for response headers after the request is written (CLI: --media-fetch-first-byte-timeout-ms).
# Default: 5000.
# media_fetch_first_byte_timeout_ms = 5000
#
# The whole fetch — every redirect hop and the body read together (CLI: --media-fetch-timeout-ms).
# Default: 15000. This is what stops a server that dribbles one byte per second.
# media_fetch_timeout_ms = 15000
#
# Largest response body accepted, bytes (CLI: --media-fetch-max-bytes). Default: 8388608 (8 MiB,
# about 8 minutes of 8 kHz mono WAV). Checked against Content-Length up front AND while reading, so
# a chunked response that declares nothing is cut off too.
# media_fetch_max_bytes = 8388608
#
# Redirect hops followed (CLI: --media-fetch-max-redirects). Default: 3. Every hop is re-validated
# against the scheme rule and the allow-list, so an open redirect cannot walk the fetch elsewhere.
# media_fetch_max_redirects = 3
#
# Hosts the engine may fetch from (CLI: --media-fetch-allow-host, repeatable). Exact,
# case-insensitive match — no wildcards, no suffix matching.
#
# UNSET (the default) MEANS UNRESTRICTED: the engine will fetch any host it can route to, from its
# own network position. That is an SSRF surface, bounded only by the http/https scheme rule. It is
# an acceptable default because the control plane is authenticated and owns the call — if you do not
# fully trust it, set this list, put the engine behind an egress policy, or leave the URL source
# unused.
# media_fetch_allow_host = ["prompts.internal.example"]

# --- ICE candidate gathering (RFC 8445 §5.1.1) --------------------------------------------------
#
# STUN servers to probe for a server-reflexive candidate (CLI: --stun-server, repeatable). Default:
# none, i.e. host-only gathering, which costs no network round trip at call setup.
#
# Only useful when the engine itself sits behind a NAT it cannot be addressed through. On a routable
# media address the probe reports back the address already advertised, and it is pruned as redundant
# (RFC 8445 §5.1.3) — a round trip per call to learn nothing. The built-in TURN server answers plain
# STUN Binding requests (RFC 8656 §12), so `turn_udp`'s address may be used here.
#
# A server that does not answer costs one bounded delay (logged) and a host-only candidate list; it
# never fails a call.
# stun_server = ["198.51.100.1:3478"]

# --- Full ICE (RFC 8445) ------------------------------------------------------------------------
#
# Run a full ICE agent on ICE legs — checklists, connectivity checks, role-conflict resolution,
# peer-reflexive discovery, nomination (CLI: --ice-full). Default: false (the ICE-lite responder).
#
# NOTE the behaviour change: on a full-agent leg the datapath answers no checks and adopts no source;
# the agent adopts the pair ICE selects, and media only flows after that. A peer that never completes
# ICE gets no media and the call is reaped with CDR reason `ice_failed`. See docs/security-and-nat.md
# §4 layer 4. Supersedes consent freshness on the legs it runs on (consent is the lite-agent
# behaviour; a full agent runs its own checks).
# ice_full = false

# --- ICE consent freshness (RFC 7675) -----------------------------------------------------------
#
# Actively probe ICE legs on their validated candidate pair and tear a call down when the peer stops
# answering (CLI: --ice-consent). Default: false.
#
# Off by default on purpose: RFC 7675 §4 says an ICE-LITE agent responds to consent checks and does
# not generate them, and `a=ice-lite` is what the engine advertises today — so initiating them is a
# deviation you opt into. Checks are always sent to the STUN-VALIDATED source, never to the peer's
# signalled c= address (which for a NATed peer is unusable, and probing it would reap live calls).
# Needs a datapath with the full-agent seam: the UDP backend has it; the XDP fast path logs a warning
# per endpoint and stays responder-only. See docs/security-and-nat.md §4 layer 4.
# ice_consent = false

# Seconds between consent checks on a validated pair; RFC 7675 §5.1 recommends ~5 s, randomised
# (CLI: --consent-interval-secs). Default: 5.
# consent_interval_secs = 5

# Seconds with no correlated, MESSAGE-INTEGRITY-verified response before the pair is declared dead
# and the call is torn down — CDR reason `consent_failed` (CLI: --consent-timeout-secs). RFC 7675
# §5.1 specifies 30 s. Default: 30.
# consent_timeout_secs = 30

# --- Advertised address & named interfaces (rtpengine-style) ------------------------------------
#
# The engine separates the IP it BINDS media sockets to (relay_bind_ip / an interface `address`) from
# the IP it ADVERTISES in rewritten SDP. The advertised IP is presentation-only — it never gates or
# latches media (not an RTPbleed vector, see docs/security-and-nat.md §12).

# Single-interface case (1:1 NAT, e.g. an AWS Elastic IP): bind a private/wildcard address but
# advertise a routable public IP in the SDP c=/o=/ICE-candidate lines (CLI: --advertise-ip). Same
# port; the socket still binds relay_bind_ip. Pair with relay_bind_ip = "0.0.0.0" or the private IP.
# Emit-only (does not affect bind, the source gate, the symmetric-RTP latch, or TURN). Ignored when
# [[interface]] entries are set below.
# advertise_ip = "203.0.113.5"

# Multi-network case: named interfaces. Each [[interface]] has a bind `address` and an optional
# `advertised` (public) IP; the control `direction` pair then selects which interface the caller-facing
# (A) leg and the callee-facing (B) leg land on — e.g. direction = ["external", "internal"] puts the
# A leg on `external` and the B leg on `internal`. Repeat a name with a v4 and a v6 `address` to serve
# both families on one interface. `default_interface` is used when a call carries no direction (or an
# unknown one); it defaults to the first interface defined.
#
# default_interface = "external"
#
# [[interface]]
# name = "internal"
# address = "10.0.0.1"          # bind + advertise 10.0.0.1 (directly reachable on the core side)
#
# [[interface]]
# name = "external"
# address = "0.0.0.0"           # bind the wildcard on the access side
# advertised = "203.0.113.5"    # advertise the public IP to peers
#
# [[interface]]
# name = "external"             # same name → the v6 address of the `external` interface
# address = "::"
# advertised = "2001:db8::5"

# --- Clustering ---------------------------------------------------------------------------------
#
# siphon-rtp scales horizontally behind the SIP control layer: the SIP proxy (SIPhon / Kamailio) is
# the media dispatcher, and each engine exposes its load + capabilities over the control protocol
# (the `load`, `node_info`, `drain` and `undrain` commands).

# Stable node identifier a dispatcher uses to tell engines apart, reported by `load` / `node_info`
# (CLI: --node-id). Defaults to the host's HOSTNAME (else "siphon-rtp") when unset.
# node_id = "rtp-ams-3"

# Advertised maximum concurrent sessions for cluster load reporting; 0 = unlimited (CLI:
# --max-sessions). Drives the normalized load score a dispatcher ranks nodes by. It does NOT cap
# admission itself — the per-client quota and the datapath port pool do that.
# max_sessions = 4000

# Bounded grace period (seconds) to drain live calls on SIGTERM/SIGINT before exiting
# (CLI: --shutdown-grace-secs). Default: 25.
# shutdown_grace_secs = 25

# --- Observability ------------------------------------------------------------------------------

# Prometheus metrics + health HTTP listen address (CLI: --metrics-addr). Off unless set. Exposes
# GET /metrics (OpenMetrics), GET /healthz (liveness), GET /readyz (readiness).
# metrics_addr = "127.0.0.1:9090"

# `tracing` env-filter directive used only when the process environment does not set one
# (RUST_LOG / the default-env filter always win over this). Not a CLI flag.
# log_filter = "info,siphon_rtp_engine=debug"

# --- TURN server (coturn replacement) -----------------------------------------------------------
#
# TURN is enabled when SIPHON_RTP_TURN_REALM and SIPHON_RTP_TURN_SECRET are set in the environment;
# at least one turn_* listener must then be configured (here or via --turn-*).

# TURN UDP listen address, `turn:` (CLI: --turn-udp).
# turn_udp = "0.0.0.0:3478"

# TURN TCP listen address, `turn:` over TCP, RFC 6062 (CLI: --turn-tcp).
# turn_tcp = "0.0.0.0:3478"

# TURN TLS listen address, `turns:` (CLI: --turn-tls). Requires turn_tls_cert + turn_tls_key.
# turn_tls = "0.0.0.0:5349"

# PEM certificate-chain file for the `turns:` listener (CLI: --turn-tls-cert).
# turn_tls_cert = "/etc/siphon-rtp/turn.pem"

# PEM private-key file for the `turns:` listener (CLI: --turn-tls-key).
# turn_tls_key = "/etc/siphon-rtp/turn.key"

# Public IP to advertise in XOR-RELAYED-ADDRESS when the relay socket's bound IP is not the
# reachable one, e.g. a NAT'd host (CLI: --turn-relay-ip). Defaults to the datapath-assigned address.
# turn_relay_ip = "203.0.113.7"

# --- Lawful interception, ETSI TS 103 221-2 X3 content delivery ---------------------------------
#
# Provisions this node to deliver intercepted media straight from the media plane to a Mediation
# Function. X1 provisioning and X2 IRI live in the signalling process, not here.
#
# The three PEM paths are what enable the feature, and ALL THREE must be set: a node with a client
# certificate but no CA counts as unprovisioned, not half-provisioned. With them absent the
# `attach_x3` control verb is REFUSED — never accepted and left delivering nowhere, which would read
# as a served warrant. See docs/lawful-interception.md.

# PEM certificate chain the engine presents to the Mediation Function, which authenticates the
# network element by certificate (CLI: --x3-client-cert).
# x3_client_cert = "/etc/siphon-rtp/li/client.pem"

# PEM private-key file for x3_client_cert (CLI: --x3-client-key).
# x3_client_key = "/etc/siphon-rtp/li/client.key"

# PEM CA the Mediation Function's own certificate is verified against (CLI: --x3-ca). The delivery
# PKI is private, so the public Mozilla bundle the WebSocket client uses is not it.
# x3_ca = "/etc/siphon-rtp/li/mdf-ca.pem"

# Network Function ID on every delivered PDU — which network element produced it
# (CLI: --x3-network-function-id, conditional attribute 6).
# x3_network_function_id = "siphon-rtp-sbc-01"

# Interception Point ID on every delivered PDU — where within that element the tap sits
# (CLI: --x3-interception-point-id, conditional attribute 7).
# x3_interception_point_id = "media-relay-a"

# Intercepted packets buffered per interception before content is dropped
# (CLI: --x3-buffer-packets). Default 20000, roughly 400 s of one direction at a 20 ms ptime.
# Deliberately far deeper than the pcap recorder's queue: a Mediation Function outage must be
# survived, not discarded through. When it does fill, the ARRIVING packet is dropped so what was
# delivered stays a contiguous prefix, and every drop raises an `x3_loss` event.
# x3_buffer_packets = 20000

# Idle seconds before a keepalive PDU is sent on the delivery connection (CLI: --x3-keepalive-secs).
# x3_keepalive_secs = 30

# --- XDP / AF_XDP kernel datapath ---------------------------------------------------------------
#
# These two keys are acted on ONLY by the separate `siphon-rtp-xdp-daemon` binary (the kernel fast
# path lives in the excluded crates/siphon-rtp-xdp workspace, not a Cargo feature). The default
# UDP-only `siphon-rtp` binary parses them (shared schema) but ignores them. The XDP daemon attaches
# the kernel datapath only when xdp_interface names a NIC AND relay_bind_ip is a routable IPv4 (the
# fast path is IPv4-only); otherwise, or on any attach failure, it falls back to UDP-loopback.

# NIC to attach the XDP/AF_XDP datapath to (CLI: --xdp-interface). Off unless set.
# xdp_interface = "eth0"

# NIC queue the AF_XDP socket binds, RX/TX (CLI: --xdp-queue). Default: 0.
# xdp_queue = 0

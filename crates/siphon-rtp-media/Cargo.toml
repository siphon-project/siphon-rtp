# siphon-rtp-media — the media plane: RTP/RTCP packet model, jitter/PLC, resampling, the leg
# pipeline, fan-out/fork, mixer, and stream bridges. Pure, sync, allocation-light, NIC-free.
[package]
name = "siphon-rtp-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "siphon-rtp media plane: RTP/RTCP, jitter/PLC, fan-out/fork, mixer, and stream bridges"
readme = "README.md"
keywords = ["rtp", "rtcp", "jitter", "voip", "media"]
categories = ["network-programming", "multimedia::audio"]

[dependencies]
siphon-rtp-codec = { path = "../siphon-rtp-codec", version = "0.4.0" }
siphon-rtp-dsp = { path = "../siphon-rtp-dsp", version = "0.4.0" }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
flume = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
iai-callgrind = { workspace = true }

[[bench]]
name = "relay_bench"
harness = false

# Deterministic instruction-count gate (valgrind/callgrind) for the CI perf-regression gate.
[[bench]]
name = "media_iai"
harness = false

[[bench]]
name = "media_blocks_bench"
harness = false

[[bench]]
name = "mixer_bench"
harness = false

[[bench]]
name = "playback_bench"
harness = false

[[bench]]
name = "qos_bench"
harness = false

[[bench]]
name = "pcap_bench"
harness = false

[[bench]]
name = "repacketize_bench"
harness = false

[[bench]]
name = "ws_bridge_bench"
harness = false

[[bench]]
name = "t140_red_bench"
harness = false

[[bench]]
name = "text_mixer_bench"
harness = false

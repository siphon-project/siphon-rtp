# .github/workflows/release.yaml — build, package, and publish on tag push.
#
# Adapted from siphon-sip's release.yaml for siphon-rtp's reality: a pure-Rust *workspace* (no
# PyO3/Python/SDK). Distribution is BINARY, not crates.io: the release ships per-target tarballs,
# an x86_64 `.deb` and `.rpm` (built from the engine crate's `[package.metadata.deb]` /
# `[package.metadata.generate-rpm]` + the systemd unit / EnvironmentFile / logrotate under dist/
# and etc/), a Docker image, and SBOMs. Differences from siphon-sip:
#   * no Python/libsctp/PyO3 setup, no PyPI job (there is no Python SDK);
#   * ONE crates.io job, and only for `siphon-rtp-proto` — the control contract is a library that
#     controllers (SIPhon and anyone else) compile against, so it has to be on crates.io at the same
#     version as the engine that speaks it. Every other member of the workspace is a daemon or an
#     internal crate and is NOT published: the `.deb`/`.rpm`, the Docker image and the tarballs ARE
#     the distribution for those. Do not widen this to `--workspace`.
#   * docker builds the Dockerfile's `runtime` (musl/distroless) target.
name: Release

on:
  push:
    tags: ["v*"]
  # Run against an existing tag (`gh workflow run release.yaml --ref vX.Y.Z`) to publish the contract
  # crate for a release that shipped before this job existed. Only the version gate and the crates.io
  # job run on a dispatch — the binaries, image and GitHub Release are already published.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Least privilege by default; each job elevates only what it needs.
permissions:
  contents: read

jobs:
  # ── Version gate ─────────────────────────────────────────────────────────
  # The git tag is the single source of truth. Refuse to publish if the workspace version
  # ([workspace.package] in Cargo.toml) doesn't match the tag, so a stray in-tree bump can never
  # ship a mismatched crate/image. Every member inherits it via `version.workspace = true`.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Workspace version must equal the tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')"
          echo "tag=$tag_version cargo=$cargo_version"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::workspace version ($cargo_version) does not match tag ($tag_version) — bump [workspace.package].version in the release commit."
            exit 1
          fi

  # ── Publish the control contract to crates.io ────────────────────────────
  # `siphon-rtp-proto` is the only published crate: it is the JSON control contract a controller
  # compiles against, so it must exist on crates.io at the same version as the engine that speaks it.
  # Everything else in the workspace ships as a binary. **Never widen this to `--workspace`** — the
  # rest of the members are daemons and internal crates and must not appear on the registry.
  #
  # Auth is crates.io Trusted Publishing (OIDC): no long-lived token in repository secrets. It has to
  # be enabled once on the crate (crates.io → siphon-rtp-proto → Settings → Trusted Publishing) for
  # repository `siphon-project/siphon-rtp` and workflow `release.yaml`. Without that the exchange step
  # fails closed and the job errors rather than silently skipping the publish.
  crates-io:
    name: publish siphon-rtp-proto to crates.io
    runs-on: ubuntu-latest
    needs: verify-version
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish the contract crate (and only that crate)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p siphon-rtp-proto --locked

  # ── Build the engine binary + tarball (per target) ───────────────────────
  build:
    needs: verify-version
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install cross linker (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p siphon-rtp
        env:
          # jemalloc (the one accepted -sys dep) cross-compiles with the gnu cross toolchain.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      # Strip the DISTRIBUTED binary only. [profile.release] keeps debug=true/strip=false because the
      # iai-callgrind perf gate needs symbols (and [profile.bench] inherits release), so stripping the
      # profile would break the gate — strip here instead, shrinking image/packages ~200MB -> ~13MB.
      - name: Strip the release binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip "target/${{ matrix.target }}/release/siphon-rtp"
          else
            strip "target/${{ matrix.target }}/release/siphon-rtp"
          fi

      # .deb / .rpm are built only on x86_64: the engine is a workspace member, so the release
      # binary is at the WORKSPACE target dir (target/<triple>/release/siphon-rtp) and both tools
      # rewrite the `target/release/` asset prefix to that triple-qualified path via `--target`.
      # `--no-build` reuses the binary the previous step already built.
      - name: Build .deb package
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-deb
          cargo deb -p siphon-rtp --target ${{ matrix.target }} --no-build

      - name: Build .rpm package
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-generate-rpm
          # cargo-generate-rpm's `-p` is the workspace member's DIRECTORY (it opens <p>/Cargo.toml),
          # not the crate name; `--target` rewrites the `target/release/` binary-asset prefix to
          # target/<triple>/release/. Source paths resolve relative to this CWD (the repo root).
          cargo generate-rpm -p crates/siphon-rtp-engine --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          ARCHIVE="siphon-rtp-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" \
            -C target/${{ matrix.target }}/release siphon-rtp \
            -C "${{ github.workspace }}" \
              LICENSE README.md \
              dist/siphon-rtp.service dist/siphon-rtp.conf etc/logrotate.d/siphon-rtp
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      # Stage everything into one flat dir. cargo-deb writes to target/debian/ (NOT triple-qualified,
      # even with --target) while cargo-generate-rpm --target writes to target/<triple>/generate-rpm/;
      # `find` locates them wherever the tools put them, and a flat upload + if-no-files-found:error
      # makes a future drift fail loudly instead of silently dropping a package.
      - name: Stage release artifacts (flat)
        run: |
          mkdir -p out
          cp "$ARCHIVE" out/
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            find target -name '*.deb' -exec cp {} out/ \;
            find target -name '*.rpm' -exec cp {} out/ \;
          fi
          ls -l out/

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  # ── Docker image → GHCR (runtime = musl/distroless) ──────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/<repo>
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64 # Dockerfile pins x86_64-unknown-linux-musl

  # ── SBOM (SPDX 2.3 + CycloneDX 1.4), attached to the release ─────────────
  sbom:
    runs-on: ubuntu-latest
    needs: verify-version
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-sbom
        run: cargo install cargo-sbom
      - name: Generate SPDX + CycloneDX SBOMs
        run: |
          cargo sbom --output-format spdx_json_2_3 > "siphon-rtp-${GITHUB_REF_NAME}.spdx.json"
          cargo sbom --output-format cyclone_dx_json_1_4 > "siphon-rtp-${GITHUB_REF_NAME}.cdx.json"
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            siphon-rtp-*.spdx.json
            siphon-rtp-*.cdx.json

  # ── GitHub Release with artifacts ────────────────────────────────────────
  github-release:
    runs-on: ubuntu-latest
    needs: [build, docker, sbom]
    if: github.event_name == 'push'
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.spdx.json
            artifacts/*.cdx.json

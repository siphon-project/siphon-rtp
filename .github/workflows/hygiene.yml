name: repo hygiene

# Guards against a local, gitignored tool/editor scratch reference slipping into a tracked file (for
# example a stray code comment or doc that names the local scratch directory). The search patterns are
# assembled from fragments at run time so this guard file itself contains none of the literal tokens it
# forbids. The .gitignore and .dockerignore intentionally list those directories to keep them out of
# the tree, so they are excluded from the scan.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-stray-local-refs:
    name: no stray local-tooling references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files
        run: |
          # Fragments concatenated at run time, so this file contains none of the literal strings it
          # searches for (a scan of the repo for them finds nothing here).
          p1='cl''aude'; p2='anthr''opic'; p3='sub''agent'; p4='project mem''ory'
          if git grep -nIiE "$p1|$p2|$p3|$p4" -- . ':!.gitignore' ':!.dockerignore'; then
            echo "::error::a tracked file references local tooling that must stay out of the public repo; reword it"
            exit 1
          fi
          echo "clean: no stray local-tooling references"

  production-file-size:
    name: production file size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check production lines per source file
        run: |
          # A source file may hold at most 1500 production lines: the lines above its last
          # `#[cfg(test)]`, so inline tests never count against it, and none at all for a test module
          # moved into its own file, which opens with `#![cfg(test)]`. Files already past that sit on the
          # allowlist at their current size and may shrink but not grow; an entry whose file has shrunk
          # under the threshold, or no longer exists, must be removed. The scan walks tracked files, so
          # it also covers the excluded XDP workspace, which the clippy job never builds.
          threshold=1500
          # path  max production lines  # why
          allowlist='
          crates/siphon-rtp-engine/src/media_pipeline.rs 4724 # large, no function over 250 lines; +64 for the secure-to-secure transcode wiring, +55 for publishing the latched source, +32 for the actor teardown grace that flushes a recording, +86 for the fax-passthrough profile validation, +10 for the secure offerer transcode, +106 for counting and logging every refused datagram, +42 for publishing received RTCP to the telemetry tap, +24 for stopping an actor and awaiting it, +13 for writing a teardown recording whole, +65 for following an ICE selection on the local pipeline, +30 for keying a DTLS caller on a transcoded call, +6 for telling a datagram that is not SRTP from a key mismatch, +1 to name the recording of a scoped call after its scope, +33 to feed a tee or decoded recording from a copy beside the verbatim relay (the decode itself lives in media_pipeline/relay_tap.rs), +20 to send nothing to a single-leg caller that will not receive
          crates/siphon-rtp-engine/src/conference.rs 2763 # large, no function over 250 lines; +5 for counting refused datagrams, +58 for filing seat RTCP with the telemetry export, -31 for moving the seat checks into their own submodule, +21 for naming the far room of each bridge channel so two rooms can be unbridged
          crates/siphon-rtp-engine/src/sdp.rs 2441 # large, no function over 250 lines; +27 for RFC 8842 a=tls-id, +290 for the T.38 m=image section (parse, anchor/decline directive, and the audio-less switchover entry points), +3 to declare the submodule that declines unanswered streams, +16 for keeping an audio codec edit inside the audio section, -42 for moving the AMR fmtp handling into its own submodule, -1 for moving the telephone-event lookup into its own submodule, +2 to declare the conference seat offer submodule, +2 for the answer-direction module
          crates/siphon-rtp-engine/src/engine/answer.rs 1501 # +1 to pin the running recordings of a call across the install a re-answer does
          crates/siphon-rtp-dsp/src/aec.rs 2651 # one algorithm; +97 for passing a leg through until its echo is located and never emitting a block louder than it arrived, mostly the comments saying why
          crates/siphon-rtp-proto/src/lib.rs 2342 # the control contract, type definitions; +27 for the authenticate controller id, +9 for the setup_timeout media-timeout reason, +26 for the fax_passthrough profile flag, +4 documenting that ws_tee decodes a secure call, +18 for the play_media blob bound, +14 for the sip_call_id profile flag, +39 for the media_started event, +12 for the attach_ws_bridge profile, +2 to declare and re-export the call scope module, +27 for the offer_far verb, +25 for the conference_offer, conference_answer and conference_unbridge verbs, +41 for the ogg_opus recording format, its bitrate field and exported bounds, +4 for the no_audio end reason of a record_call stream
          crates/siphon-rtp-codec/src/opus/celt/encoder.rs 1996 # reference port
          crates/siphon-rtp-codec/src/amr/nb/enc_cb.rs 1905 # reference port
          crates/siphon-rtp-codec/src/amr/wb/enc_acelp.rs 1850 # reference port
          crates/siphon-rtp-codec/src/opus/enc/encoder.rs 1806 # reference port; +15 for OPUS_GET_LOOKAHEAD, which an Ogg muxer needs for pre-skip
          crates/siphon-rtp-xdp/src/lib.rs 1530 # the Datapath impl for the whole backend; +15 for the userspace drop counter that redirect-path refusals are added to; +16 for the consumer RTCP tap
          '
          status=0
          while IFS= read -r file; do
            production=$(awk '/^[[:space:]]*#!?\[cfg\(test\)\]/ {cut = NR - 1; seen = 1} END {print (seen ? cut : NR)}' "$file")
            limit=$(printf '%s\n' "$allowlist" | awk -v path="$file" '$1 == path {print $2}')
            if [ -n "$limit" ]; then
              if [ "$production" -gt "$limit" ]; then
                echo "::error file=$file::$production production lines against an allowlist entry of $limit; split the file, or raise the entry and say why in the diff"
                status=1
              elif [ "$production" -le "$threshold" ]; then
                echo "::error file=$file::$production production lines is within the $threshold limit; remove its allowlist entry"
                status=1
              elif [ "$production" -lt "$limit" ]; then
                echo "::notice file=$file::$production production lines, allowlisted at $limit; lower the entry to lock in the gain"
              fi
            elif [ "$production" -gt "$threshold" ]; then
              echo "::error file=$file::$production production lines, over the $threshold limit; split the file"
              status=1
            fi
          done < <(git ls-files ':(glob)crates/**/src/**/*.rs')
          while read -r path _; do
            if [ -n "$path" ] && [ ! -f "$path" ]; then
              echo "::error::allowlist entry $path names a file that no longer exists; remove it"
              status=1
            fi
          done <<< "$allowlist"
          if [ "$status" -eq 0 ]; then
            echo "clean: every production source file is within its size limit"
          fi
          exit "$status"

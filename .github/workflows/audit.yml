name: Security audit

# RustSec advisories are time-varying: a new advisory can land against an unchanged dependency, so
# this runs on a schedule (and whenever the dependency set changes) instead of gating every PR.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: cargo-deny advisories
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # cargo-deny installed pinned and run directly (not the cargo-deny-action, whose injected
      # --log-level flag broke on the cargo-deny 0.19 CLI, which removed that global flag).
      - name: Install cargo-deny (pinned)
        run: cargo install cargo-deny --version 0.19.9 --locked
      - name: Check advisories
        run: cargo deny --all-features check advisories

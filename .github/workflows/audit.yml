name: Security audit

# RustSec advisories are time-varying: a new advisory can land against an unchanged dependency. This
# runs them daily, so one surfaces within a day rather than a week, and on any push to main that changes
# a dependency set. Pull requests get the same check as an informational job in ci.yml, and release.yaml
# gates on it before anything is published.
on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # cargo-deny installed pinned and run directly (not the cargo-deny-action, whose injected
      # --log-level flag broke on the cargo-deny 0.19 CLI, which removed that global flag).
      - name: Install cargo-deny (pinned)
        run: cargo install cargo-deny --version 0.19.9 --locked
      # Every lockfile: the workspace, the fuzz harness and the excluded XDP workspace each pin their own
      # versions, and the XDP lockfile held a yanked `spin` that a root-only audit never read.
      - name: Check advisories on every lockfile
        run: |
          status=0
          for manifest in Cargo.toml fuzz/Cargo.toml crates/siphon-rtp-xdp/Cargo.toml; do
            echo "::group::$manifest"
            cargo deny --manifest-path "$manifest" --all-features check --config deny.toml \
              advisories || status=1
            echo "::endgroup::"
          done
          exit "$status"

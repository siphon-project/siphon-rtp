name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the latest commit on a ref matters — cancel superseded in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Most jobs run on free GitHub-hosted runners (ubuntu-latest) now that the repo is public.
# Only two stay on the RTT self-hosted runner: perf-gate (iai-callgrind builds base + head twice
# and wants the beefy box) and xdp-integration (privileged kernel / eBPF, self-hosted only).
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The house gate: clippy must be clean across every target and feature.
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Default features = UDP-loopback datapath (NIC-free); integration tests are NOT #[ignore]d,
      # so they run here too. --locked keeps the build reproducible against the committed lockfile.
      - run: cargo test --workspace --all-features --locked

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins `stable`; RUSTUP_TOOLCHAIN outranks that file, so cargo really
      # builds on the declared MSRV instead of silently falling back to stable.
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # rust-version = "1.88": the shippable crates must compile on it (tests/benches excluded).
      # Floor set by transitive deps: clap_builder needs the 2024 edition (>=1.85), the icu/idna stack
      # (icu_* 2.2, idna_adapter) needs >=1.86, and `time` >=0.3.47 (the RUSTSEC-2026-0009 DoS fix,
      # pulled in via siphon-rtp-dtls -> webrtc-dtls -> x509-parser) needs >=1.88.
      - run: cargo check --workspace --all-features --locked

  docs:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  benches:
    name: bench compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Keep the criterion (wall-clock) perf benches compiling so they never bit-rot. The
      # actual ">10% regression fails CI" gate runs in the `perf-gate` job below, on the
      # deterministic iai-callgrind instruction-count benches.
      - run: cargo bench --workspace --all-features --no-run --locked

  deny:
    name: cargo-deny (no C deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The deterministic half of cargo-deny: bans (the #1 hard rule — pure Rust, ZERO C library
      # deps), licenses (OSI-permissive allow-list) and sources (crates.io only). All three are a
      # pure function of the dependency graph, so their verdict only changes when a PR changes the
      # graph — a PR that pulls in a GPL crate, a git source or a duplicate-version blowup fails
      # right here. Time-varying RustSec advisories deliberately live in audit.yml (weekly + on
      # main) so a new advisory against unchanged code never turns a green PR red. cargo-deny is
      # installed pinned and run directly (not the cargo-deny-action, whose injected --log-level
      # flag broke on the cargo-deny 0.19 CLI, which removed that global flag).
      - name: Install cargo-deny (pinned)
        run: cargo install cargo-deny --version 0.19.9 --locked
      - name: Check bans + licenses + sources
        run: cargo deny --all-features check bans licenses sources

  # ── SBOM (SPDX 2.3 + CycloneDX 1.4) — supply-chain inventory, uploaded as an artifact ─────
  sbom:
    name: SBOM (SPDX + CycloneDX)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-sbom
        run: cargo install cargo-sbom
      - name: Generate SPDX + CycloneDX SBOMs
        run: |
          cargo sbom --output-format spdx_json_2_3 > sbom.spdx.json
          cargo sbom --output-format cyclone_dx_json_1_4 > sbom.cdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json

  # ── Fuzz every untrusted-bytes parser + codec decoder (nightly + cargo-fuzz) ──────────────
  # House rule: a malformed/truncated/hostile datagram or codec bitstream must
  # decode-or-error, never panic / read OOB / spin. Each target gets a 30 s smoke here (a fast
  # regression net over the saved corpus + new mutation); deep runs belong on a scheduled/OSS-Fuzz
  # harness. Covers the RTP/RTCP parser, the SDP + NG/bencode + native-JSON control parsers, the
  # STUN/TURN framing, and the AMR-NB/WB RFC 4867 payload decoders.
  fuzz:
    name: fuzz (parsers + codec decoders, 30s each)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Fuzz each target (30s smoke each)
        run: |
          for target in \
            rtp_parser_fuzz sdp_fuzz bencode_fuzz proto_frame_fuzz stun_fuzz \
            amr_wb_decode_fuzz amr_nb_decode_fuzz opus_decode_fuzz tone_spec_fuzz; do
            echo "::group::fuzz $target"
            cargo +nightly fuzz run "$target" -- -max_total_time=30
            echo "::endgroup::"
          done

  # ── Docker image builds (musl/distroless runtime target — no push, no privileged run) ────
  # GitHub runners can't grant the NET_ADMIN/BPF caps the compose profiles need, so we only prove
  # the image builds; the privileged XDP run is a self-hosted-runner / local concern.
  docker-build:
    name: docker build (runtime)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Perf-regression gate (iai-callgrind, deterministic instruction counts) ───────────────
  # House rule: a >10% regression vs the baseline fails CI. Callgrind counts *instructions
  # executed*, which is deterministic run-to-run (unlike the wall-clock criterion benches, too noisy
  # to gate on a shared runner). We build the baseline from the PR's base (main) in this same runner,
  # so the two instruction counts are directly comparable, then re-run the PR against it; the bench's
  # `soft_limits([(Ir, 10.0)])` makes iai-callgrind exit non-zero on a >10% regression. PR-only.
  #
  # Runs on a **hosted** runner, deliberately. It used to ask for `[self-hosted, linux, x64]` for
  # speed (it builds base and head), but that is wrong on two counts now the repository is public:
  #
  #  1. It silently stopped running. The org runner group sets `allows_public_repositories=false`, so
  #     from the moment this repo went public the self-hosted runners refused every job it queued —
  #     the gate sat queued forever and nothing enforced the 10% rule.
  #  2. It is the same hazard `xdp-integration` below already refuses by name: a self-hosted runner
  #     must not execute untrusted PR code, and this job *is* PR-triggered.
  #
  # Nothing is lost by moving. Callgrind counts instructions, not wall-clock, so the numbers are just
  # as valid on a shared runner — the beefy box only ever bought build time. Both sides of the
  # comparison still run in this one job, which is what makes them comparable.
  perf-gate:
    name: perf regression (iai-callgrind)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      - name: Install iai-callgrind-runner
        run: cargo install iai-callgrind-runner --version 0.16.1 --locked
      - name: Compare PR against the base baseline (fail on >10% instruction regression)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BENCHES="--bench codec_iai --bench media_iai --bench srtp_iai"
          # Baseline from the base commit (main) in this same runner, so instruction counts are
          # directly comparable. If base predates these benches (the PR that introduces them), there is
          # nothing to compare against yet, so just prove the PR benches build and run.
          git checkout --quiet "$BASE_SHA"
          if cargo bench $BENCHES --no-run >/dev/null 2>&1; then
            cargo bench $BENCHES -- --save-baseline=main
            HAVE_BASE=1
          else
            echo "base $BASE_SHA has no iai benches yet; skipping the comparison this once"
            HAVE_BASE=0
          fi
          git checkout --quiet "$HEAD_SHA"
          if [ "$HAVE_BASE" = 1 ]; then
            cargo bench $BENCHES -- --baseline=main
          else
            cargo bench $BENCHES
          fi

  # ── XDP / eBPF datapath (self-hosted, kernel-capable runner) ─────────────────────────────
  # The eBPF loader is a separate, excluded workspace on a pinned nightly + bpf-linker, so the normal
  # jobs never build it and it can bit-rot. This builds the eBPF program + the AF_XDP loader and runs
  # its unit tests. push / manual only, never on a (possibly fork) PR: a self-hosted runner must not
  # execute untrusted PR code. Kept out of the `CI passed` rollup while it is new.
  xdp-integration:
    name: xdp build + loader tests (self-hosted)
    runs-on: [self-hosted, linux, x64]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: crates/siphon-rtp-xdp
    steps:
      - uses: actions/checkout@v7
      # Puts rustup + cargo on PATH (stable, for the loader crate); the eBPF sub-crate pins its own
      # nightly via ebpf/rust-toolchain.toml, installed in the next step.
      - uses: dtolnay/rust-toolchain@stable
      - name: eBPF toolchain (pinned nightly + rust-src + bpf-linker)
        run: |
          rustup toolchain install nightly-2026-01-15 --component rust-src --profile minimal
          command -v bpf-linker >/dev/null 2>&1 || cargo install bpf-linker --locked
      # No --locked below: this is a separate workspace whose Cargo.lock pins the sibling `siphon-rtp`
      # crates by path and records their versions, so any main-workspace version bump or new dep
      # restales it (and it is not auto-synced). This job is excluded from the `CI passed` rollup and
      # is push/manual-only experimental, so resolve fresh rather than red the whole run on a lock skew.
      - name: Build the eBPF program + XDP/AF_XDP loader
        run: cargo build
      # The XDP-enabled daemon binary: depends UP into the stable engine (`siphon-rtp`) + this crate,
      # probes/attaches the kernel datapath, and drives `siphon_rtp_engine::run_with_datapath`. Built
      # here (only where the eBPF toolchain exists); the default UDP `siphon-rtp` binary is unaffected
      # and stays xdp-free in every normal job.
      - name: Build the siphon-rtp-xdp-daemon binary
        run: cargo build --bin siphon-rtp-xdp-daemon
      # Loader unit tests + the daemon's pure `choose_datapath` selection tests (NIC-free).
      - name: Run the loader + daemon unit tests
        run: cargo test
      # Live veth XDP_TX relay smoke: attach the classifier in SKB mode, install a FORWARD flow,
      # inject an RTP/UDP datagram and capture the frame the program relays — asserting the L2/L3/L4
      # rewrite + both checksums. Self-skips (logs + passes) without CAP_NET_ADMIN / veth / generic
      # XDP, so it never fails an unprivileged runner; `--nocapture` surfaces the skip/run message.
      - name: veth XDP_TX relay smoke (self-skips without CAP_NET_ADMIN)
        run: cargo test --test xdp_tx_smoke -- --nocapture

  # Single required status check for branch protection: green only if every job above is green.
  # perf-gate is included: it runs on pull_request (success) and is skipped on the push-to-main build,
  # and `if: always()` + the failure/cancelled check treats a skipped job as non-failing. xdp-integration
  # is deliberately excluded (push/manual-only, experimental toolchain) until it is proven stable.
  ci:
    name: CI passed
    if: always()
    needs: [fmt, clippy, test, msrv, docs, benches, deny, sbom, fuzz, docker-build, perf-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

# NOTE: the eBPF/XDP loader is an excluded workspace on its own pinned nightly + bpf-linker; the
# `xdp-integration` job above builds and unit-tests it on the self-hosted runner (push/manual only).
# A privileged veth + SKB-XDP attach smoke (the docker-compose `dev` profile) is a follow-up. CD
# (release / container) is intentionally omitted for now.

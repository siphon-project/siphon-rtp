name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the latest commit on a ref matters — cancel superseded in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The house gate (CLAUDE.md): clippy must be clean across every target and feature.
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Default features = UDP-loopback datapath (NIC-free); integration tests are NOT #[ignore]d,
      # so they run here too. --locked keeps the build reproducible against the committed lockfile.
      - run: cargo test --workspace --all-features --locked

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins `stable`; RUSTUP_TOOLCHAIN outranks that file, so cargo really
      # builds on the declared MSRV instead of silently falling back to stable.
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # rust-version = "1.88": the shippable crates must compile on it (tests/benches excluded).
      # Floor set by transitive deps: clap_builder needs the 2024 edition (>=1.85), the icu/idna stack
      # (icu_* 2.2, idna_adapter) needs >=1.86, and `time` >=0.3.47 (the RUSTSEC-2026-0009 DoS fix,
      # pulled in via siphon-rtp-dtls -> webrtc-dtls -> x509-parser) needs >=1.88.
      - run: cargo check --workspace --all-features --locked

  docs:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  benches:
    name: bench compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Keep the criterion perf gates compiling so they never bit-rot. The full
      # ">10% regression fails CI" gate (CLAUDE.md) needs a stored baseline (critcmp /
      # github-action-benchmark) — tracked as a follow-up; here we only prove they build.
      - run: cargo bench --workspace --all-features --no-run --locked

  deny:
    name: cargo-deny (no C deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Enforces the #1 hard rule — pure Rust, ZERO C library deps — via deny.toml's ban list,
      # plus the crates.io source allow-list. Time-varying RustSec advisories live in audit.yml so
      # a new advisory never turns a green PR red on unchanged code.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans sources

  # ── SBOM (SPDX 2.3 + CycloneDX 1.4) — supply-chain inventory, uploaded as an artifact ─────
  sbom:
    name: SBOM (SPDX + CycloneDX)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-sbom
        run: cargo install cargo-sbom
      - name: Generate SPDX + CycloneDX SBOMs
        run: |
          cargo sbom --output-format spdx_json_2_3 > sbom.spdx.json
          cargo sbom --output-format cyclone_dx_json_1_4 > sbom.cdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json

  # ── Fuzz every untrusted-bytes parser + codec decoder (nightly + cargo-fuzz) ──────────────
  # CLAUDE.md hard rule: a malformed/truncated/hostile datagram or codec bitstream must
  # decode-or-error, never panic / read OOB / spin. Each target gets a 30 s smoke here (a fast
  # regression net over the saved corpus + new mutation); deep runs belong on a scheduled/OSS-Fuzz
  # harness. Covers the RTP/RTCP parser, the SDP + NG/bencode + native-JSON control parsers, the
  # STUN/TURN framing, and the AMR-NB/WB RFC 4867 payload decoders.
  fuzz:
    name: fuzz (parsers + codec decoders, 30s each)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Fuzz each target (30s smoke each)
        run: |
          for target in \
            rtp_parser_fuzz sdp_fuzz bencode_fuzz proto_frame_fuzz stun_fuzz \
            amr_wb_decode_fuzz amr_nb_decode_fuzz; do
            echo "::group::fuzz $target"
            cargo +nightly fuzz run "$target" -- -max_total_time=30
            echo "::endgroup::"
          done

  # ── Docker image builds (musl/distroless runtime target — no push, no privileged run) ────
  # GitHub runners can't grant the NET_ADMIN/BPF caps the compose profiles need, so we only prove
  # the image builds; the privileged XDP run is a self-hosted-runner / local concern.
  docker-build:
    name: docker build (runtime)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Single required status check for branch protection: green only if every job above is green.
  ci:
    name: CI passed
    if: always()
    needs: [fmt, clippy, test, msrv, docs, benches, deny, sbom, fuzz, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

# NOTE: crates/siphon-rtp-ebpf* carry their own pinned-nightly toolchain (bpf-linker) and are not
# yet workspace members. Add a dedicated nightly job when they land. CD (release / container) is
# intentionally omitted for now.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the latest commit on a ref matters — cancel superseded in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The house gate (CLAUDE.md): clippy must be clean across every target and feature.
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Default features = UDP-loopback datapath (NIC-free); integration tests are NOT #[ignore]d,
      # so they run here too. --locked keeps the build reproducible against the committed lockfile.
      - run: cargo test --workspace --all-features --locked

  msrv:
    name: msrv (1.86)
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins `stable`; RUSTUP_TOOLCHAIN outranks that file, so cargo really
      # builds on the declared MSRV instead of silently falling back to stable.
      RUSTUP_TOOLCHAIN: "1.86.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      # rust-version = "1.86": the shippable crates must compile on it (tests/benches excluded).
      # Floor set by transitive deps: clap_builder needs the 2024 edition (>=1.85) and the icu/idna
      # stack (icu_* 2.2, idna_adapter) needs >=1.86.
      - run: cargo check --workspace --all-features --locked

  docs:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  benches:
    name: bench compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Keep the criterion perf gates compiling so they never bit-rot. The full
      # ">10% regression fails CI" gate (CLAUDE.md) needs a stored baseline (critcmp /
      # github-action-benchmark) — tracked as a follow-up; here we only prove they build.
      - run: cargo bench --workspace --all-features --no-run --locked

  deny:
    name: cargo-deny (no C deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Enforces the #1 hard rule — pure Rust, ZERO C library deps — via deny.toml's ban list,
      # plus the crates.io source allow-list. Time-varying RustSec advisories live in audit.yml so
      # a new advisory never turns a green PR red on unchanged code.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans sources

  # ── SBOM (SPDX 2.3 + CycloneDX 1.4) — supply-chain inventory, uploaded as an artifact ─────
  sbom:
    name: SBOM (SPDX + CycloneDX)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-sbom
        run: cargo install cargo-sbom
      - name: Generate SPDX + CycloneDX SBOMs
        run: |
          cargo sbom --output-format spdx_json_2_3 > sbom.spdx.json
          cargo sbom --output-format cyclone_dx_json_1_4 > sbom.cdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json

  # ── Fuzz the media-plane parsers (nightly + cargo-fuzz) ──────────────────────────────────
  # CLAUDE.md hard rule: the RTP/RTCP parser must never panic / read OOB / spin on a hostile
  # datagram. 60 s is a smoke pass; deeper runs belong on a scheduled/OSS-Fuzz harness.
  fuzz:
    name: fuzz (RTP/RTCP parser, 60s)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Fuzz rtp_parser_fuzz (60s)
        run: cargo +nightly fuzz run rtp_parser_fuzz -- -max_total_time=60

  # ── Docker image builds (musl/distroless runtime target — no push, no privileged run) ────
  # GitHub runners can't grant the NET_ADMIN/BPF caps the compose profiles need, so we only prove
  # the image builds; the privileged XDP run is a self-hosted-runner / local concern.
  docker-build:
    name: docker build (runtime)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Single required status check for branch protection: green only if every job above is green.
  ci:
    name: CI passed
    if: always()
    needs: [fmt, clippy, test, msrv, docs, benches, deny, sbom, fuzz, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

# NOTE: crates/siphon-rtp-ebpf* carry their own pinned-nightly toolchain (bpf-linker) and are not
# yet workspace members. Add a dedicated nightly job when they land. CD (release / container) is
# intentionally omitted for now.

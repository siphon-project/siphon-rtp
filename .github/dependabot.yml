# Dependabot — weekly, grouped to keep PR noise low.
#
# NOTE: cargo PRs must NOT be auto-merged. CLAUDE.md mandates the perf baseline + memory-leak soak
# before every commit, and CI does not run the perf gate — a crate bump that is green in CI can
# still regress throughput or leak. Treat each cargo PR as "green CI AND I ran the perf/mem
# baseline". github-actions and docker bumps are safe to merge on green CI.
version: 2
updates:
  # Rust crate dependencies — one grouped PR for all minor/patch bumps; major bumps arrive as
  # individual PRs to review deliberately.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # The fuzz crate is its own (detached) workspace, so it needs a separate cargo entry.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly

  # Pinned action versions in the workflows (checkout, rust-cache, docker/*, cargo-deny, …).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # dtolnay/rust-toolchain's tag IS the Rust toolchain it installs (e.g. @1.86.0 = the MSRV pin),
      # not an action release. Dependabot "upgrading" it to a newer tag (it bumped @1.86.0 → @1.100.0,
      # a nonexistent rustc) silently breaks the msrv job. Pin this one manually.
      - dependency-name: "dtolnay/rust-toolchain"

  # Dockerfile base images (debian:trixie-slim, distroless/static).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

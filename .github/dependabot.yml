# Dependabot — weekly, grouped to keep PR noise low.
#
# NOTE: cargo PRs are not auto-merged. A crate bump can regress throughput or leak memory without
# tripping the obvious checks, so treat each cargo PR as "green CI" (which now includes the
# instruction-count perf gate and the memory-leak soak). github-actions and docker bumps are safe to
# merge on green CI.
version: 2
updates:
  # Rust crate dependencies — one grouped PR for all minor/patch bumps; major bumps arrive as
  # individual PRs to review deliberately.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # aes/ctr are deliberately held below the RustCrypto 0.9 wave (aes 0.9 / ctr 0.10 / cipher 0.5):
      # it regresses the SRTP AES-CTR hot path 20-60% (the batched AES-NI block path is lost). Not a
      # security bump — see crates/siphon-rtp-srtp/Cargo.toml and the perf-investigation notes.
      # Patch updates on the held line still come through.
      - dependency-name: "aes"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "ctr"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # webrtc-util is version-locked to webrtc-dtls (0.12 requires webrtc-util 0.11); bumping it on
      # its own breaks the Conn/KeyingMaterialExporter trait match. It moves only in lockstep with the
      # webrtc-rs stack, never as a standalone PR.
      - dependency-name: "webrtc-util"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # The fuzz crate is its own (detached) workspace, so it needs a separate cargo entry. Grouped for
  # the same reason as "/", and more so: every bump here touches the one file fuzz/Cargo.lock, so
  # ungrouped PRs conflict with each other the moment one merges and each survivor needs a rebase
  # plus a full CI round.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # Pinned action versions in the workflows (checkout, rust-cache, docker/*, cargo-deny, …).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # dtolnay/rust-toolchain's tag IS the Rust toolchain it installs (e.g. @1.88.0 = the MSRV pin),
      # not an action release. Dependabot "upgrading" it to a newer tag (it bumped @1.86.0 → @1.100.0,
      # a nonexistent rustc) silently breaks the msrv job. Pin this one manually.
      - dependency-name: "dtolnay/rust-toolchain"

  # Dockerfile base images (debian:trixie-slim, distroless/static).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

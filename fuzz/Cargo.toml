[package]
name = "siphon-rtp-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Detach from the parent workspace: cargo-fuzz builds with its own sanitizer profile and lockfile,
# and `cargo test --workspace` must never pull this nightly-only crate in.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
# Every crate with a parser that eats untrusted bytes off the network gets a fuzz target. The codec
# crate is included with the `amr` feature so the AMR-NB/WB RFC 4867 payload decoders (a hostile
# codec bitstream off the wire) are fuzzed too, alongside the Opus packet framing and CELT decode.
siphon-rtp-media = { path = "../crates/siphon-rtp-media" }
siphon-rtp-engine = { package = "siphon-rtp", path = "../crates/siphon-rtp-engine" }
siphon-rtp-ngcompat = { path = "../crates/siphon-rtp-ngcompat" }
siphon-rtp-proto = { path = "../crates/siphon-rtp-proto" }
siphon-rtp-stun = { path = "../crates/siphon-rtp-stun" }
siphon-rtp-ice = { path = "../crates/siphon-rtp-ice" }
siphon-rtp-codec = { path = "../crates/siphon-rtp-codec", features = ["amr"] }
siphon-rtp-li = { path = "../crates/siphon-rtp-li" }

# RFC 3550/3551/5761 — RTP header, compound RTCP, rtcp-mux classifier.
[[bin]]
name = "rtp_parser_fuzz"
path = "fuzz_targets/rtp_parser_fuzz.rs"
test = false
doc = false
bench = false

# RFC 4566/3264 — SDP parse + offer/answer rewrite against a fixed engine endpoint.
[[bin]]
name = "sdp_fuzz"
path = "fuzz_targets/sdp_fuzz.rs"
test = false
doc = false
bench = false

# rtpengine NG/bencode — bencode decode + cookie split + NG command mapping.
[[bin]]
name = "bencode_fuzz"
path = "fuzz_targets/bencode_fuzz.rs"
test = false
doc = false
bench = false

# Native JSON control framing — length-prefix + JSON Request decode.
[[bin]]
name = "proto_frame_fuzz"
path = "fuzz_targets/proto_frame_fuzz.rs"
test = false
doc = false
bench = false

# RFC 5389/5766 — STUN message + attribute TLV parse, TURN ChannelData framing.
[[bin]]
name = "stun_fuzz"
path = "fuzz_targets/stun_fuzz.rs"
test = false
doc = false
bench = false

# RFC 8445 §7.2/§7.3 — the ICE agent's datagram ingest (checks, responses, role conflict, prflx).
[[bin]]
name = "ice_agent_fuzz"
path = "fuzz_targets/ice_agent_fuzz.rs"
test = false
doc = false
bench = false

# RFC 8839 §5.1/§5.6 — ICE candidate + ice-options grammar off a peer's SDP.
[[bin]]
name = "ice_candidate_fuzz"
path = "fuzz_targets/ice_candidate_fuzz.rs"
test = false
doc = false
bench = false

# RFC 2198/4103 — RED depacketizer + T.140 reassembler (hostile real-time-text payload off the wire).
[[bin]]
name = "red_parse"
path = "fuzz_targets/red_parse.rs"
test = false
doc = false
bench = false

# 3GPP TS 26.171 / RFC 4867 — AMR-WB RTP payload parse + ACELP decode (hostile codec bitstream).
[[bin]]
name = "amr_wb_decode_fuzz"
path = "fuzz_targets/amr_wb_decode_fuzz.rs"
test = false
doc = false
bench = false

# 3GPP TS 26.071 / RFC 4867 — AMR-NB RTP payload parse + ACELP decode (hostile codec bitstream).
[[bin]]
name = "amr_nb_decode_fuzz"
path = "fuzz_targets/amr_nb_decode_fuzz.rs"
test = false
doc = false
bench = false

# RFC 6716 — Opus packet framing (§3) + CELT decode (§4.3). The most reachable codec parser here: an
# Opus leg is a WebRTC peer sending arbitrary bytes.
[[bin]]
name = "opus_decode_fuzz"
path = "fuzz_targets/opus_decode_fuzz.rs"
test = false
doc = false
bench = false

# Call-progress tone cadence grammar — a controller-supplied `play_media` tone string, parsed and
# then rendered, so neither the parser nor the generator can be driven off the rails.
[[bin]]
name = "tone_spec_fuzz"
path = "fuzz_targets/tone_spec_fuzz.rs"
test = false
doc = false
bench = false

# ETSI TS 103 221-2 §5.2 — the X2/X3 PDU header read back from the Mediation Function on the lawful
# -interception delivery connection. The stream framing is computed from its length fields, so a
# hostile length must not underflow, wrap, or desynchronise the reader.
[[bin]]
name = "li_pdu_fuzz"
path = "fuzz_targets/li_pdu_fuzz.rs"
test = false
doc = false
bench = false

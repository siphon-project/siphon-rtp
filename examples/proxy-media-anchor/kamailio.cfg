#!KAMAILIO
#
# Minimal media-anchoring SIP proxy: Kamailio signals, siphon-rtp anchors the media.
#
# The only siphon-rtp-specific line is the rtpengine socket below: point it at siphon-rtp's `--ng`
# listener instead of a real rtpengine and nothing else in the routing script changes. siphon-rtp
# speaks the rtpengine NG protocol, so `rtpengine_manage()` drives offer / answer / delete exactly
# as it would against rtpengine. See docs/migrating-from-rtpengine.md.
#
# Start the engine first:
#     siphon-rtp --ng 127.0.0.1:22222 --relay-bind-ip <your-public-ip> --port-min 30000 --port-max 40000
# Then run Kamailio with this config. Every call's media is relayed through the engine (topology
# hiding / NAT anchoring); the endpoints never see each other's media address.

####### Global #######
debug=2
log_stderror=yes
fork=yes
children=4
listen=udp:0.0.0.0:5060

####### Modules #######
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "rtpengine.so"

# The one line that matters: the media engine's control socket. This is siphon-rtp's --ng address,
# where a real deployment would have put rtpengine's.
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22222")

####### Routing #######
request_route {
    # Sanity + in-dialog handling.
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (has_totag()) {
        loose_route();
        if (is_method("BYE")) {
            rtpengine_delete();   # release the media relay when the call ends
        } else if (is_method("INVITE")) {
            rtpengine_manage();   # re-anchor on re-INVITE (hold/resume, codec change)
        }
        route(RELAY);
        exit;
    }

    if (is_method("INVITE")) {
        record_route();           # stay in the signalling path for BYE
        rtpengine_manage();       # OFFER: rewrite the caller's SDP to the engine's media address
        route(RELAY);
        exit;
    }

    if (is_method("ACK|CANCEL")) {
        route(RELAY);
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
}

route[RELAY] {
    t_on_reply("HANDLE_SDP");
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

onreply_route[HANDLE_SDP] {
    # ANSWER: when the callee's 18x/200 carries SDP, rewrite it back to the engine's address too.
    if (has_body("application/sdp")) {
        rtpengine_manage();
    }
}
